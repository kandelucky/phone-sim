<!DOCTYPE html>
<!--
  Demo app for the phone simulator. sim.html opens it by default.

  Each card on the home screen is one thing an app can do on a phone. Its screen has two tabs:
    Try   the feature, working (in the simulator, or in an APK)
    Code  how it is done: short snippets to copy into your own app; ⓘ on each says where the call comes from
  ⓘ on a card or a screen = what it is and how the simulator shows it. Every action writes a line in the console.

  Files:
    index.html     the frame (markup only): home, the ⓘ and exit dialogs
    demo.css       the demo's own styles; everything else is Tailwind + daisyUI classes
    core.js        cards, screens, tabs, ⓘ, back, exit, background, the command line
    features/*.js  one file per feature; each adds itself with Demo.add({…}) (see core.js)

  A new feature = one file in features/ + one <script> line at the end of this file. Its card appears by itself.
-->
<html lang="en" data-theme="dark" class="h-full">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: the app is drawn under the system bars; demo.css keeps the content clear of them -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo</title>

<link rel="stylesheet" href="../lib/daisyui.css">
<link rel="stylesheet" href="../lib/daisyui-themes.css">
<link rel="stylesheet" href="demo.css">
<script src="../lib/tailwind.js"></script>
<!-- Before any app script: it patches sound and touch on load. Outside the simulator it does nothing. -->
<script src="../sim-bridge.js"></script>

<style type="text/tailwindcss">
  /* Register daisyUI colours with Tailwind, otherwise opacity variants like text-base-content/60 do not exist.
     The Tailwind browser build reads only this inline block, so it stays here and not in demo.css. */
  @theme reference {
    --color-base-100: var(--color-base-100); --color-base-200: var(--color-base-200); --color-base-300: var(--color-base-300);
    --color-base-content: var(--color-base-content);
    --color-primary: var(--color-primary); --color-primary-content: var(--color-primary-content);
    --color-secondary: var(--color-secondary); --color-secondary-content: var(--color-secondary-content);
    --color-accent: var(--color-accent); --color-accent-content: var(--color-accent-content);
    --color-neutral: var(--color-neutral); --color-neutral-content: var(--color-neutral-content);
    --color-info: var(--color-info); --color-success: var(--color-success);
    --color-warning: var(--color-warning); --color-error: var(--color-error);
  }
</style>
</head>

<body class="h-full m-0 bg-base-100 text-base-content">
  <main id="app" class="h-full">

    <!-- ===== Home: core.js puts the cards in #cards; the feature screens are added after it on their first open ===== -->
    <section id="home">
      <header class="bar">
        <span class="ico" style="--c: var(--color-primary)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/></svg></span>
        <div class="flex-1 min-w-0">
          <h1 class="font-bold leading-tight">Phone Sim Demo</h1>
          <!-- features/data.js puts the saved name here -->
          <p id="hello" class="text-xs muted truncate">Try it · read the code · copy it</p>
        </div>
        <button class="btn btn-ghost btn-circle btn-sm" data-music="icon" aria-label="Music on / off"></button>
        <button class="btn btn-ghost btn-circle btn-sm ibtn" data-info="app" aria-label="About this demo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></button>
      </header>
      <div id="cards" class="scroll"></div>
    </section>

  </main>

  <!-- ===== ⓘ: a sheet from the bottom; core.js draws it for the app, a feature or a snippet ===== -->
  <dialog id="info" class="modal modal-bottom">
    <div class="modal-box">
      <div class="grab"></div>
      <div id="infoBody"></div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>

  <!-- ===== Exit dialog: back on the first screen asks before leaving (the usual Android pattern) ===== -->
  <dialog id="quit" class="modal">
    <div class="modal-box max-w-xs">
      <h3 class="text-lg font-bold">Exit the app?</h3>
      <div class="modal-action">
        <button id="quitNo" class="btn">No</button>
        <button id="quitYes" class="btn btn-primary">Yes</button>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>

  <div id="toast" role="status"></div>

  <!-- core.js first: it makes Demo.add. Then the features, in any order: the cards follow GROUPS in core.js. -->
  <script src="core.js"></script>
  <script src="features/touch.js"></script>
  <script src="features/vibrate.js"></script>
  <script src="features/music.js"></script>
  <script src="features/links.js"></script>
  <script src="features/ads.js"></script>
  <script src="features/back.js"></script>
  <script src="features/background.js"></script>
  <script src="features/keyboard.js"></script>
  <script src="features/network.js"></script>
  <script src="features/console.js"></script>
  <script src="features/data.js"></script>
  <script src="features/fps.js"></script>
</body>
</html>
