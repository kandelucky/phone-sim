      ["vol1", "Volume steps", "Close to a phone's, not exact. Your computer's speakers are not a phone's speaker."],
      ["megaphone", "Ads", "A stand-in only: a real ad, its content and its loading time do not show (here 0.8 s). Banner and interstitial only; no rewarded, app-open or native ads. The consent form (EEA) does not show: the answer is the one a user outside the EEA gets. The adaptive banner's height is an estimate. On a phone the app may stop under an interstitial; here it does not."],
      ["monitor", "On a phone", "The full version works on a computer only. On a phone (or a tablet) the simulator opens, but screenshot, video and Choose folder do not work. In a narrow window the top bar swipes sideways and the console is a strip at the bottom."],

    { id: "build", ic: "code", name: "For app builders", intro: "This tab is for the people who make the app.", items: [
      ["code", "sim-bridge.js", "One line in the app's <code>&lt;head&gt;</code>. Without it the app still shows, but back, background, volume, finger mode, vibration, links, ads, the bars' sizes, the console and themes do not reach it, and the console says the app did not answer. <code>app.html</code> (the empty starter app) and the demo (<code>demo/</code>) already have it."],
      ["shieldCheck", "Safe on a phone", "Outside the simulator the bridge does nothing, so the same file becomes an Android app unchanged."],
      ["megaphone", "Ads in code", "The AdMob plugin: <code>@capacitor-community/admob</code>. The app gets it with one line: <code>var AdMob = window.Capacitor &amp;&amp; Capacitor.isNativePlatform() ? Capacitor.Plugins.AdMob : window.simAdMob;</code> On a phone the real plugin answers; in the simulator the bridge's stand-in does, with the same calls and events (showBanner, hideBanner, resumeBanner, removeBanner, prepareInterstitial, showInterstitial, addListener). Example: the demo's <code>ads.js</code>."],
      ["appWindow", "As its own app", "In Chrome and Edge the simulator installs as its own app (<b>Phone Sim</b>): the install icon at the right of the address bar, or Chrome's ⋮ menu. It opens in its own window, has an icon in the Start menu and works offline too (after it was opened online once). Works on the simulator opened as a web page (the live demo or a local server), not from a file. For a project copy to install, copy <code>manifest.webmanifest</code> and the <code>icons/</code> folder too."],

  ] };
  var HELP = HELPS[lang];

  // ---- ⚙ Settings: the drop-down panel ----

  // ---- Open app → Choose folder: the app's own folder, read by the browser and served by sim-sw.js ----

  var folder = null;                                   // { id, read }: what this tab opened (a folder or an APK); read(path) = the file's bytes or null
  // Finds the app's page: index.html, else the first .html; in the folder itself, then in www/ and dist/ (Capacitor, build output)
  function findEntry(dir) {

  // ---- Open app → Choose APK: the web part of an Android app, served the same way as a folder ----
  // An APK is a zip. Only a web app inside it can run here: assets/public/ (Capacitor) or assets/www/ (Cordova, Construct 2).
  // A native app (Java / Kotlin, Unity, Flutter) has neither: it needs a real Android emulator.
  // The APK is not unpacked: its list of files is read once, then each file when the phone asks for it (DecompressionStream, no library).
  // Native plugins do not exist here; only the simulator's own stand-ins answer (ads, vibration, exit).
  var APK_ROOTS = ["assets/public/", "assets/www/"];
  // The zip's list of files: { "assets/www/index.html": { flag, method, csize, at } }. Throws on a file that is not a zip (or zip64)
  function apkList(file) {
    function view(a, b) { return file.slice(a, b).arrayBuffer().then(function (x) { return new DataView(x); }); }
    var tail = Math.min(file.size, 65557);                                   // the end record (22) + the longest comment (65535)
    return view(file.size - tail, file.size).then(function (v) {
      var e = -1;
      for (var i = v.byteLength - 22; i >= 0; i--) if (v.getUint32(i, true) === 0x06054b50) { e = i; break; }
      if (e < 0) throw new Error("not a zip");
      var n = v.getUint16(e + 10, true), size = v.getUint32(e + 12, true), off = v.getUint32(e + 16, true);
      if (n === 0xffff || off === 0xffffffff) throw new Error("zip64");

        for (var k = 0; k < n; k++) {

    }, function () { log(T("apkBad", name), "warn"); })
    .catch(function (e) { log(T("error") + esc(e && e.message), "err"); });
  };

  // ---- Console: the app's log lines, via postMessage ----
  // Every line is kept as { kind, html, text, t, n (×N), s (its group shape) }, so the filter, the search, copy and save work on them.
  // kind: "app" (the app's log(), console.log / info / debug, snapshot, its answers), "sim" (the simulator's own),
  // "touch" (one line per gesture, ⚙ → Touches in console), "cmd" (the command line: › what was typed, ← the answer or its error), "warn", "err".
  // Each kind has its own colour class (k-<kind>) and its own filter chip; the hidden kinds are remembered.
  // Only the newest MAX_LINES stay: an app that logs every frame would otherwise grow the page without end.
  var conBody = $("consoleBody"), lines = [], MAX_LINES = 5000;
  var KINDS = ["app", "sim", "touch", "cmd", "warn", "err"], KIND_T = { app: "fApp", sim: "fSim", touch: "fTouch", cmd: "fCmd", warn: "fWarn", err: "fErr" };
  var KIND_C = { app: "var(--color-base-content)", sim: "color-mix(in oklab, var(--color-base-content) 40%, transparent)", touch: "var(--color-info)",
                 cmd: "var(--color-accent)", warn: "var(--color-warning)", err: "var(--color-error)" };   // the chip's dot
  function zero() { return { app: 0, sim: 0, touch: 0, cmd: 0, warn: 0, err: 0 }; }
  var counts = zero(), conOff = {}, conQuery = "", pinned = true, unseen = 0;
  try { (JSON.parse(load(KEY + "-sim-conoff") || "[]") || []).forEach(function (k) { if (KIND_T[k]) conOff[k] = true; }); } catch (e) {}
  if (KINDS.every(function (k) { return conOff[k]; })) conOff = {};
  function conShows(l) { return !conOff[l.kind] && (!conQuery || l.text.toLowerCase().indexOf(conQuery) !== -1); }
  function lineEl(l) {
    var d = document.createElement("div");
    d.className = "k-" + l.kind + (l.bad ? " bad" : "");
    d.innerHTML = '<span class="t">' + l.t + "</span>" + l.html + (l.n > 1 ? '<span class="rep">×' + l.n + "</span>" : "");
    l.el = d;                                      // the line's element while it shows (null when the filter / search hides it)
    return d;
  }
  // ---- Groups: similar lines in a row fold into one ----
  // A run = the shown lines in a row with one shape: the same kind and the same text once its numbers are out
  // (a touch line's shape also leaves out the "→ element" it hit: l.g = its text without it). GRP_MIN lines or more = a group:
  // a head (▸, the newest line's time, the shape with # for each number, "N lines") over the lines, closed until it is pressed.

    grip.classList.remove("drag"); screen.style.pointerEvents = ""; document.body.style.cursor = "";
    if (sizeTag) { sizeTag.remove(); sizeTag = null; }
    saveSize();
  }
  grip.addEventListener("pointerup", gripEnd);
  grip.addEventListener("pointercancel", gripEnd);
  grip.addEventListener("dblclick", function () { if (dockEff === "right") conW = CON_W; else conH = CON_H; saveSize(); dockApply(); toast(T("dockReset")); });

  barsSel.onchange = function () { save(KEY + "-sim-bars", barsSel.value); apply(); };
  cut.onchange = function () { save(KEY + "-sim-cut", cut.checked ? "1" : "0"); apply(); };
  // Custom W×H (⚙ → Size): kept within 200–2000 px (the fields' min / max, which typing can go past) and remembered
  // until another device is picked.
  function sizeFit(v, was) { v = Math.round(+v); return v ? Math.max(200, Math.min(2000, v)) : was; }
  function customSize() { W = sizeFit(cw.value, W); H = sizeFit(ch.value, H); save(KEY + "-sim-size", W + "x" + H); apply(); }
  cw.onchange = customSize;
  ch.onchange = customSize;
  window.addEventListener("resize", dockApply);   // also re-checks the console panel's limits
  devTog.innerHTML = icon("chevronDown", 15);
  devTog.onclick = function () { devOpen = !devOpen; dockApply(); };
  $("devTabs").addEventListener("click", function () { if (narrow() && !devOpen) { devOpen = true; dockApply(); } });
  // A browser that cannot capture the tab (a phone's: no getDisplayMedia, or a touch screen with no mouse) gets no 📷 / 🎥
  // and a note under the top bar: the full version needs a computer. ✕ = gone for good.
  var md0 = navigator.mediaDevices, noCap = !md0 || !md0.getDisplayMedia || (matchMedia("(pointer: coarse)").matches && !matchMedia("(any-pointer: fine)").matches);
  if (noCap) {
    ["shot", "rec", "presShot", "presRec"].forEach(function (id) { $(id).closest(".relative").style.display = "none"; });
    $("pcNote").hidden = load(KEY + "-sim-pcnote") === "0";
  }
  $("pcNoteIc").innerHTML = icon("monitor", 14);
  $("pcNoteX").onclick = function () { $("pcNote").hidden = true; save(KEY + "-sim-pcnote", "0"); dockApply(); };
  // Narrow window: ⓘ beside the phone shows the line under the phone as a bubble; a tap elsewhere, Esc or a resize closes it
  var infoBtn = $("infoBtn");
  infoBtn.innerHTML = icon("info", 14);
  function infoPop(on) {
    info.classList.toggle("pop", on); infoBtn.classList.toggle("on", on);
    if (!on) return;
    var r = infoBtn.getBoundingClientRect();
    var rt = Math.max(8, Math.round(window.innerWidth - r.right));
    info.style.right = rt + "px"; info.style.maxWidth = (window.innerWidth - rt - 8) + "px";   // 8 px clear of the left edge too
    info.style.bottom = Math.round(window.innerHeight - r.top + 6) + "px";
  }
  infoBtn.onclick = function () { infoPop(!info.classList.contains("pop")); };
  document.addEventListener("pointerdown", function (e) { if (info.classList.contains("pop") && !infoBtn.contains(e.target)) infoPop(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") infoPop(false); });
  window.addEventListener("resize", function () { infoPop(false); });

  // ---- Video: the phone as a video file, through the screenshot's screen capture (the browser asks every time) ----
  // ⏺ opens a menu of two, as 📷 does. screen = the screen only, as a phone's own screen recording does. phone = the phone with
  // its frame and camera, no shadow, on the page's background (an MP4 cannot be transparent). Each frame of the tab is cut and
  // drawn on a canvas, and the canvas is recorded. MP4 when this browser can write it, otherwise WEBM. Sound = the tab's own sound (⚙ → Sound in video).
  // The tab is asked at twice its size, as for the screenshot: Chrome draws it twice as sharp while it records.
  var rec = null, recAsk = false, recSound = $("recSound"), presBar = $("presBar"), presT = 0;   // rec = the recording now, or null
  recSound.checked = load(KEY + "-sim-recsound") !== "0";   // on by default
  recSound.onchange = function () { save(KEY + "-sim-recsound", recSound.checked ? "1" : "0"); };
  var REC_TYPES = { snd:  ["video/mp4;codecs=avc1,mp4a.40.2", "video/mp4;codecs=avc1,opus", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"],
                    mute: ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"] };
  function recType(snd) { return REC_TYPES[snd ? "snd" : "mute"].filter(function (t) { return MediaRecorder.isTypeSupported(t); })[0] || ""; }
  function presOn() { return document.body.classList.contains("present"); }
  // presentation mode's card: a tile = a big icon over its name (+ the time while recording)
  function presTile(b, ic, label, time) { b.innerHTML = icon(ic, 22) + "<span>" + label + (time ? ' <span class="recTime"></span>' : "") + "</span>"; }
  function presText() { presTile($("presShot"), "camera", T("presShot")); presTile($("presExit"), "exit", T("presOut")); }   // Video = recUI()
  function presMenuOpen() { return !$("presRecBox").hidden || !$("presShotBox").hidden; }
  // what the corner control covers now: the dot (+ the time) or the open card (+ an open menu); for the Phone video's paint-over
  function presRect() {
    var o = null;
    [presBar.classList.contains("show") ? $("presCard") : $("presDot"), presBar.querySelector(":scope > .recTime"), $("presRecBox"), $("presShotBox")].forEach(function (el) {
      if (!el || el.hidden) return;
      var q = el.getBoundingClientRect(); if (!q.width) return;
      o = o ? { left: Math.min(o.left, q.left), top: Math.min(o.top, q.top), right: Math.max(o.right, q.right), bottom: Math.max(o.bottom, q.bottom) }
            : { left: q.left, top: q.top, right: q.right, bottom: q.bottom };
    });
    return o;
  }
  function two(n) { return String(n).padStart(2, "0"); }
  function recTimeUI() {
    var s = rec ? Math.floor((Date.now() - rec.t0) / 1000) : 0;
    Array.prototype.forEach.call(document.querySelectorAll(".recTime"), function (el) { el.hidden = !rec; el.textContent = Math.floor(s / 60) + ":" + two(s % 60); });
  }
  function recUI() {
    var rb = $("rec"); setBtn(rb, rec ? "stop" : "video", rec ? TIP.recStop : TIP.video); rb.classList.toggle("text-error", !!rec);
    presTile($("presRec"), rec ? "stop" : "video", T(rec ? "presStop" : "presVid"), !!rec); $("presRec").classList.toggle("text-error", !!rec);
    presBar.classList.toggle("rec", !!rec);
    // While it records the shape must stay: no turning, no other device or size, no presentation switch. Zoom is fine (the picture is scaled).
    $("rotate").disabled = sel.disabled = cw.disabled = ch.disabled = $("present").disabled = !!rec;
    recTimeUI();
  }
  function recStart(kind) {
    var md = navigator.mediaDevices, dpr = shotDpr || window.devicePixelRatio || 1;
    if (!md || !md.getDisplayMedia || !window.MediaRecorder) { log(T("recNo"), "warn"); return; }
    recAsk = true;
    recDpr = shotDpr = dpr;                    // as the screenshot: the tab is asked at 2×, Chrome doubles devicePixelRatio for
                                               // the whole recording, Natural size keeps this one until the end
    md.getDisplayMedia({ video: { displaySurface: "browser", frameRate: { ideal: 30 }, width: { ideal: Math.round(window.innerWidth * dpr * 2) }, height: { ideal: Math.round(window.innerHeight * dpr * 2) } },
                         audio: recSound.checked, preferCurrentTab: true, selfBrowserSurface: "include", surfaceSwitching: "exclude" }).then(function (stream) {
      var st = stream.getVideoTracks()[0].getSettings ? stream.getVideoTracks()[0].getSettings() : {}, v = document.createElement("video");
      function drop(msg, how) { recAsk = false; recDpr = shotDpr = 0; document.body.classList.remove("recP"); stream.getTracks().forEach(function (t) { t.stop(); }); v.srcObject = null; if (msg) log(msg, how); }
      if (st.displaySurface && st.displaySurface !== "browser") { drop(T("recTab"), "warn"); return; }
      if (kind === "phone") document.body.classList.add("recP");   // the shadow goes before the first frame (its corner = the background)
      v.muted = true; v.srcObject = stream;
      v.play().then(function () {
        setTimeout(function () {                            // time for the browser's question to close (as for the screenshot)
          try { recGo(stream, v, drop, kind); } catch (err) { drop(T("error") + esc(err.message), "err"); }
        }, 500);
      }, function (err) { drop(T("error") + esc(err.message), "err"); });
    }, function (err) { recAsk = false; recDpr = shotDpr = 0; if (err && err.name === "NotAllowedError") log(T("recDenied")); else log(T("error") + esc(err && err.message), "err"); });
  }
  // the part of the tab a recording keeps, in CSS px: the glass, or the phone's outline + a little room (the screenshot's), inside the stage
  function recCutRect(kind) {
    if (kind === "screen") return glass.getBoundingClientRect();
    var p = phoneRect(), s = $("stage").getBoundingClientRect(), pad = 12 * phone.getBoundingClientRect().width / phone.offsetWidth;
    return { left: Math.max(s.left, p.left - pad), top: Math.max(s.top, p.top - pad), right: Math.min(s.right, p.right + pad), bottom: Math.min(s.bottom, p.bottom + pad) };
  }
  function recGo(stream, v, drop, kind) {
    var k = v.videoWidth / window.innerWidth, r = kind === "screen" ? glass.getBoundingClientRect() : phoneRect();
    if (!v.videoWidth) { drop(T("recNo"), "warn"); return; }
    if (r.left < 0 || r.top < 0 || r.right > window.innerWidth || r.bottom > window.innerHeight) { drop(T("recCut"), "warn"); return; }
    r = recCutRect(kind);
    function even(n) { return Math.max(2, Math.floor(n / 2) * 2); }   // H.264 wants even sides
    var c = document.createElement("canvas"), g = c.getContext("2d", { alpha: false });
    var cw0 = (r.right - r.left) * k, ch0 = (r.bottom - r.top) * k;
    var cap = Math.min(1, 3840 / Math.max(cw0, ch0), Math.sqrt(3840 * 2160 / (cw0 * ch0)));   // no bigger than 4K: H.264 encoders stop there
    c.width = even(cw0 * cap); c.height = even(ch0 * cap);
    // bits per second follow the size (≈ 0.3 bit per pixel per frame): text stays sharp while it moves; 8–25 Mbit/s
    var snd = stream.getAudioTracks().length > 0, type = recType(snd), opt = { videoBitsPerSecond: Math.round(Math.min(25e6, Math.max(8e6, c.width * c.height * 30 * 0.3))) };
    if (type) opt.mimeType = type;
    var mr = new MediaRecorder(new MediaStream(c.captureStream(30).getVideoTracks().concat(stream.getAudioTracks())), opt);
    var R = { stream: stream, v: v, c: c, mr: mr, chunks: [], t0: Date.now(), kind: kind, snd: snd, type: mr.mimeType || type || "video/webm", bg: "", bps: opt.videoBitsPerSecond };
    // One frame: the tab's picture, cut, fitted into the canvas. The window may change size while it records (the browser's own
    // "sharing this tab" bar, the console panel, the zoom), so the cut is measured again every frame.
    function frame() {
      if (rec !== R) return;
      var k = v.videoWidth / window.innerWidth, q = recCutRect(R.kind), sx, sy, sw, sh;
      if (R.kind === "screen") { sx = Math.ceil(q.left * k); sy = Math.ceil(q.top * k); sw = Math.floor(q.right * k) - sx; sh = Math.floor(q.bottom * k) - sy; }   // whole pixels inside the glass
      else { sx = Math.max(0, Math.floor(q.left * k)); sy = Math.max(0, Math.floor(q.top * k)); sw = Math.min(v.videoWidth, Math.ceil(q.right * k)) - sx; sh = Math.min(v.videoHeight, Math.ceil(q.bottom * k)) - sy; }
      if (sw > 0 && sh > 0) {
        var f = Math.min(c.width / sw, c.height / sh), ox = (c.width - sw * f) / 2, oy = (c.height - sh * f) / 2;
        if (R.kind === "phone" && !R.bg) { g.drawImage(v, sx, sy, 2, 2, 0, 0, 1, 1); var p = g.getImageData(0, 0, 1, 1).data; R.bg = "rgb(" + p[0] + "," + p[1] + "," + p[2] + ")"; }   // the cut's corner = the page's background
        g.fillStyle = R.bg || "#000"; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(v, sx, sy, sw, sh, ox, oy, sw * f, sh * f);
        var b = R.kind === "phone" && presOn() && presRect(), m = 28;   // presentation mode's corner control (and its shadow) is painted over
        if (b) g.fillRect(ox + ((b.left - m) * k - sx) * f, oy + ((b.top - m) * k - sy) * f, (b.right - b.left + 2 * m) * k * f, (b.bottom - b.top + 2 * m) * k * f);
      }
      R.raf = requestAnimationFrame(frame);
    }
    mr.ondataavailable = function (e) { if (e.data && e.data.size) R.chunks.push(e.data); };
    mr.onstop = function () { recSave(R); };
    stream.getVideoTracks()[0].addEventListener("ended", function () { if (rec === R) recStop(); });   // the browser's own "Stop sharing"
    if (kind === "screen") glass.classList.add("rec");
    mr.start(1000);
    rec = R; recAsk = false;
    R.timer = setInterval(recTimeUI, 500);
    frame(); recUI();
    log(T("recStart", kind, c.width, c.height, R.type.split(";")[0].split("/")[1].toUpperCase(), snd));
    if (recSound.checked && !snd) log(T("recNoSnd"), "warn");
  }
  function recStop() {
    var R = rec; if (!R) return;
    rec = null; R.t1 = Date.now();
    cancelAnimationFrame(R.raf); clearInterval(R.timer);
    if (R.mr.state !== "inactive") R.mr.stop();          // the last piece of data comes, then onstop saves the file
    R.stream.getTracks().forEach(function (t) { t.stop(); }); R.v.srcObject = null;
    recDpr = shotDpr = 0;                                 // the capture is over: devicePixelRatio comes back, Natural size follows it
    glass.classList.remove("rec"); document.body.classList.remove("recP");
    recUI();
  }
  function recSave(R) {
    var ext = /mp4/.test(R.type) ? "mp4" : "webm", blob = new Blob(R.chunks, { type: R.type.split(";")[0] });
    R.mr.stream.getTracks().forEach(function (t) { t.stop(); });
    if (!blob.size) { log(T("recEmpty"), "warn"); return; }
    var d = new Date(), s = Math.round((R.t1 - R.t0) / 1000), a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "video-" + (R.kind === "phone" ? "phone-" : "") + R.c.width + "x" + R.c.height + "-" + d.getFullYear() + two(d.getMonth() + 1) + two(d.getDate()) + "-" + two(d.getHours()) + two(d.getMinutes()) + two(d.getSeconds()) + "." + ext;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
    log(T("recLog", R.c.width, R.c.height, Math.floor(s / 60) + ":" + two(s % 60), ext.toUpperCase(), (blob.size / 1048576).toFixed(1)));
  }

  // ---- Presentation mode: only the phone shows, on the plain background (for a video, or to show the app to someone) ----
  // Its controls (Lasha's pick „დ“, 2026-11-11): a faint dot in the window's top-left corner; the mouse on it opens a card with three
  // tiles (Video, Screenshot, Exit). 0.8 s after the mouse leaves it folds back into the dot, never while one of its menus is open.
  // On entering it shows for 2.5 s, so one sees where it lives (his word). Not remembered: a refresh opens the normal view.
  // Out: Esc (when the app does not have the focus) or the Exit tile.
  function presPeek(ms) {
    presBar.classList.add("show"); clearTimeout(presT);
    presT = setTimeout(function () { if (presBar.matches(":hover") || presMenuOpen()) presPeek(800); else presBar.classList.remove("show"); }, ms);
  }
  function presSet(on) {
    if (on === presOn()) return;
    if (!on && rec) recStop();                           // a recording started here (Present is locked during one) ends with it and is saved
    drops.forEach(function (d) { d(false); });
    document.body.classList.toggle("present", on);
    apply();
    if (on) presPeek(2500); else { clearTimeout(presT); presBar.classList.remove("show"); }
    log(T(on ? "presOnLog" : "presOffLog"));
  }
  $("present").onclick = function () { presSet(true); };
  $("presExit").onclick = function () { presSet(false); };
  $("presDot").onmouseenter = $("presDot").onclick = function () { presPeek(800); };
  presBar.addEventListener("mouseleave", function () { if (presBar.classList.contains("show")) presPeek(800); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && presOn() && !presMenuOpen()) presSet(false); });   // Esc in an open menu closes only the menu
  // ⏺ (top bar and presentation bar) = the menu Screen / Phone; while it records, ⏺ stops instead. Set up after the Esc above,
  // so that one still sees the menu open.
  var REC_KINDS = [["screen", "scan", "shotScr", "recScrH"], ["phone", "smartphone", "shotPh", "recPhH"]];
  [["rec", "recBox"], ["presRec", "presRecBox"]].forEach(function (p) {
    var btn = $(p[0]), box = $(p[1]), ul = box.querySelector(".recMenu"), show = dropDown(box, btn), open = btn.onclick;
    btn.onclick = function () {
      if (rec) { recStop(); return; }
      if (recAsk) return;
      ul.innerHTML = REC_KINDS.map(function (s) {
        return '<li><a data-k="' + s[0] + '">' + icon(s[1], 16) + '<span class="flex flex-col gap-0.5"><span>' + T(s[2]) + '</span><span class="text-xs text-base-content/50">' + T(s[3]) + "</span></span></a></li>";
      }).join("");
      open();
    };
    ul.onclick = function (e) { var a = e.target.closest("[data-k]"); if (a) { show(false); recStart(a.dataset.k); } };
  });
  // the card's Screenshot tile = the same menu as 📷 in the top bar; set up after the Esc above too
  var presShotBox = $("presShotBox"), presShotUl = presShotBox.querySelector("ul"), showPresShot = dropDown(presShotBox, $("presShot")), presShotOpen = $("presShot").onclick;
  $("presShot").onclick = function () { presShotUl.innerHTML = shotItems(); presShotOpen(); };
  presShotUl.onclick = function (e) { var a = e.target.closest("[data-k]"); if (a) { showPresShot(false); shoot(a.dataset.k); } };
  presText(); recUI();

  // ---- Language (⚙): everything the simulator shows switches at once; lines already in the console stay as they were ----
  var langSel = $("langSel");
  Object.keys(LANGS).forEach(function (l) { var o = document.createElement("option"); o.value = l; o.textContent = LANGS[l]; langSel.appendChild(o); });
  langSel.value = lang;
  langSel.onchange = function () {
    lang = langSel.value; TIP = TIPS[lang]; HELP = HELPS[lang];
    save("sim-lang", lang);
    staticText(); countUI(); deviceList();
    Array.prototype.forEach.call(document.querySelectorAll("[data-icon]"), function (b) { setBtn(b, b.dataset.icon, TIP[b.dataset.icon]); });
    zoomTip(); deviceTip();
    lifeUI(); touchUI(); volUI(false); conLangUI(); presText(); recUI(); dockApply();
    log(T("langLog"));
  };

  var savedDev = load(KEY + "-sim-device");
  if (savedDev !== null && DEVICES[+savedDev]) sel.value = savedDev;
  device(sel.value);
  var savedSize = /^(\d+)x(\d+)$/.exec(load(KEY + "-sim-size") || "");   // a custom W×H wins over the device's own
  if (savedSize) { W = sizeFit(savedSize[1], W); H = sizeFit(savedSize[2], H); }
  barsSel.value = load(KEY + "-sim-bars") || "buttons";   // 3 buttons by default: ◁ and ○ can be pressed
  cut.checked = load(KEY + "-sim-cut") !== "0";   // on by default: most phones today have a camera hole
  lifeUI();
  volUI(false);
  touchUI();
  dockApply();                               // places the console panel, then apply() fits the phone
</script>
