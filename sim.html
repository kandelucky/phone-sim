<!DOCTYPE html>
<html lang="en" data-theme="dark" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone simulator</title>
<!-- Installable as its own app in Chrome and Edge (Phone Sim): manifest.webmanifest + icons/ -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/phone-sim.svg" type="image/svg+xml">
<link rel="stylesheet" href="lib/daisyui.css">
<link rel="stylesheet" href="lib/daisyui-themes.css">
<script src="lib/tailwind.js"></script>
<style type="text/tailwindcss">
  @theme reference {
    --color-base-100: var(--color-base-100); --color-base-200: var(--color-base-200); --color-base-300: var(--color-base-300);
    --color-base-content: var(--color-base-content);
    --color-primary: var(--color-primary); --color-primary-content: var(--color-primary-content);
    --color-secondary: var(--color-secondary); --color-secondary-content: var(--color-secondary-content);
    --color-accent: var(--color-accent); --color-accent-content: var(--color-accent-content);
    --color-neutral: var(--color-neutral); --color-neutral-content: var(--color-neutral-content);
    --color-info: var(--color-info); --color-success: var(--color-success);
    --color-warning: var(--color-warning); --color-error: var(--color-error);
  }

  #consoleBody .t { @apply text-base-content/40 mr-2; }
  #consoleBody > div { white-space: pre-wrap; overflow-wrap: anywhere; }
  #consoleBody .rep { @apply ml-2 px-1.5 rounded-full bg-base-content/15 text-base-content; }   /* ×N: the same line N times in a row */
</style>
<style>
  /* Tooltips: a hint under each icon button (first line = name, then what it does) */
  .tip { position: relative; display: inline-flex; }
  .tip::after {
    content: attr(data-tip); position: absolute; top: calc(100% + 6px); left: 0; z-index: 15;   /* under the open menus (z-20) */
    width: max-content; max-width: 260px; padding: 6px 9px; border-radius: 6px;
    background: rgba(0,0,0,.88); color: #fff; font: 12px/1.4 "Segoe UI", sans-serif; white-space: pre-line;
    opacity: 0; pointer-events: none; transition: opacity .12s;
  }
  .tip:hover::after { opacity: 1; transition-delay: 1s; }
  .tip.quiet:hover::after { opacity: 0; transition-delay: 0s; }   /* pressed: no hint until the mouse leaves */
  .tip.tip-r::after { left: auto; right: 0; }
  /* Touch screens have no hover, so no hints: a tap would leave one standing */
  @media (hover: none) { .tip::after { display: none; } }
  /* Narrow window (body.narrow, under 800 px: a phone, a tablet held upright; set by dockApply()): the top bar = one row that
     swipes sideways, its panels open full width under it (--barB = the bar's bottom); the console = a strip at the bottom
     (#dev.shut = its head only), the arrow or a tab opens it to half the height */
  body.narrow #bar { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  body.narrow #bar > * { flex-shrink: 0; }
  body.narrow #bar .tip::after { display: none; }
  body.narrow :is(#appBox, #shotBox, #recBox, #zoomBox, #dockBox, #opts) { position: fixed; top: calc(var(--barB, 45px) + 6px); left: 8px; right: 8px;
    width: auto; margin: 0; max-height: calc(100dvh - var(--barB, 45px) - 14px); overflow-y: auto; }
  body.narrow #grip { display: none; }
  body.narrow #dev.shut { overflow: hidden; }
  #devTog svg { transition: transform .12s; }
  #devTog.up svg { transform: rotate(180deg); }
  #pcNote:not([hidden]) { display: flex; }
  /* Narrow window: the line under the phone hides behind #infoBtn (a faint ⓘ in the sizer's right margin, level with the
     phone's bottom); a tap shows it as a bubble above the button (#info.pop, placed by the script) */
  #infoBtn { display: none; position: absolute; right: 1px; bottom: 12px; width: 18px; height: 18px; padding: 0; border: 0; background: none;
             align-items: center; justify-content: center; color: var(--color-base-content); opacity: .35; cursor: pointer; }
  #infoBtn.on { opacity: .8; }
  body.narrow #infoBtn { display: flex; }
  body.narrow #info { display: none; }
  body.narrow #info.pop { display: block; position: fixed; z-index: 15; max-width: calc(100vw - 16px); padding: 6px 9px; border-radius: 6px;
                          background: rgba(0,0,0,.88); color: #fff; text-align: left; line-height: 1.45; }
  body.shotK #infoBtn, body.shotW #infoBtn, body.recP #infoBtn, body.present #infoBtn { visibility: hidden; }
  /* Console line colours: the command line's own lines (› typed, ← answer) and the touches stand apart from the plain lines */
  #consoleBody .k-touch { color: var(--color-info); }
  #consoleBody .k-cmd { color: var(--color-accent); }
  #consoleBody .k-cmd.bad { color: var(--color-error); }
  #consoleBody .k-cmd .arr { opacity: .55; }
  /* Console group: similar lines in a row fold under one head (▸ time, the line's pattern with # for numbers, "N lines"); a press opens it */
  #consoleBody .gh { cursor: pointer; user-select: none; border-radius: 4px; }
  #consoleBody .gh:hover { background: color-mix(in oklab, var(--color-base-content) 6%, transparent); }
  #consoleBody .gh svg { display: inline-block; vertical-align: -2px; margin: 0 4px 0 -2px; opacity: .6; transition: transform .12s; }
  #consoleBody .grp.open > .gh svg { transform: rotate(90deg); }
  #consoleBody .gh .num { opacity: .45; }
  #consoleBody .gh .cnt { margin-left: 8px; font-size: 10px; opacity: .55; }
  #consoleBody .gb { display: none; padding-left: 14px; }
  #consoleBody .grp.open > .gb { display: block; }
  /* Console filter: one tiny chip per kind of line that shows; +N = the hidden ones (a list) */
  .chip { display: inline-flex; align-items: center; gap: 3px; height: 15px; padding: 0 5px; border-radius: 999px;
          font-size: 10px; line-height: 1; cursor: pointer; user-select: none; white-space: nowrap;
          background: color-mix(in oklab, var(--color-base-content) 9%, transparent); color: color-mix(in oklab, var(--color-base-content) 75%, transparent); }
  .chip .dot, #conFMenu .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--c); flex: none; }
  #conFMenu .dot { width: 7px; height: 7px; }
  .chip:hover { background: color-mix(in oklab, var(--color-base-content) 16%, transparent); color: var(--color-base-content); }
  .chip.add { padding: 0 4px; background: transparent; border: 1px dashed color-mix(in oklab, var(--color-base-content) 30%, transparent); }
  .chip.add.btn-active { border-style: solid; }
  /* Command line = a small editor: line numbers, 2 lines to start, grows to 6, then scrolls; long lines scroll sideways (numbers stay true) */
  #conCmdRow { box-shadow: inset 2px 0 0 var(--color-accent); }
  #conCmd, #cmdGut { font: 14px/24px ui-monospace, "Cascadia Mono", Consolas, monospace; }
  #conCmd { min-height: 48px; max-height: 144px; resize: none; background: transparent; outline: none; color: var(--color-base-content);
            white-space: pre; overflow: auto; scrollbar-width: thin; }
  #conCmd::placeholder { color: color-mix(in oklab, var(--color-base-content) 35%, transparent); }
  #cmdGut { min-width: 2.2em; max-height: 144px; overflow: hidden; }
  /* ⓘ window: one row per item = icon + name + text */
  #helpBody h3 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
  #helpBody .intro { color: color-mix(in oklab, var(--color-base-content) 65%, transparent); margin: 0 0 18px; font-size: 14px; line-height: 1.5; }
  #helpBody .hi { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid color-mix(in oklab, var(--color-base-content) 8%, transparent); }
  #helpBody .hic { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: var(--color-base-200); font: 600 11px/1 "Segoe UI", sans-serif; }
  #helpBody .hic svg { width: 18px; height: 18px; }
  #helpBody .hic .dot { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.42); border: 1.5px solid rgba(255,255,255,.9); box-shadow: 0 0 0 1px rgba(0,0,0,.3); }
  /* the item title is a block of its own; a <b> inside the text stays inline */
  #helpBody .ht .hn { display: block; font-size: 14px; margin-bottom: 2px; }
  #helpBody { outline: none; }
  #helpBody .ht { font-size: 13.5px; line-height: 1.5; color: color-mix(in oklab, var(--color-base-content) 75%, transparent); }
  #helpBody .ht b, #helpBody .ht code { color: var(--color-base-content); }
  #helpBody code { font: 12.5px Consolas, monospace; background: var(--color-base-200); padding: 1px 4px; border-radius: 4px; }
  #helpBody .eg { display: inline-block; margin: 4px 0; padding: 3px 8px; border-radius: 6px; background: var(--color-base-200); font-size: 12px; }
  #bar .pill { display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: 10px; background: color-mix(in oklab, var(--color-base-content) 7%, transparent); }
  /* Console panel's inner edge: an 8 px grab zone over the border, a thin line on hover / while dragging */
  #grip { position: absolute; z-index: 10; }
  #grip::after { content: ""; position: absolute; background: var(--color-primary); opacity: 0; transition: opacity .12s; }
  #grip:hover::after, #grip.drag::after { opacity: .9; }
  #main.dock-right #grip { left: -4px; top: 0; bottom: 0; width: 8px; cursor: col-resize; }
  #main.dock-right #grip::after { left: 3px; top: 0; bottom: 0; width: 2px; }
  #main.dock-bottom #grip { top: -4px; left: 0; right: 0; height: 8px; cursor: row-resize; }
  #main.dock-bottom #grip::after { top: 3px; left: 0; right: 0; height: 2px; }
  #sizeTag { position: fixed; z-index: 40; padding: 2px 7px; border-radius: 6px; background: rgba(0,0,0,.85); color: #fff; font: 12px "Segoe UI", sans-serif; pointer-events: none; }

  /* ── The phone frame ── */
  #stage { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  #fit { flex: 1; display: flex; overflow: hidden; min-height: 0; }
  /* #sizer = the phone's size after scale (set in apply()); margin:auto centres it, and when the zoom is bigger than the window #fit scrolls */
  #sizer { margin: auto; position: relative; flex-shrink: 0; }
  #phone {
    background: #0b0d11;
    border: 3px solid #3a4152;
    border-radius: 34px;
    padding: 14px 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,.55), inset 0 0 0 2px #14161c;
    position: absolute; left: 20px; top: 12px;
    transform-origin: 0 0;
  }
  #phone::before {
    content: ""; position: absolute; top: 5px; left: 50%; transform: translateX(-50%);
    width: 54px; height: 5px; border-radius: 3px; background: #262c38;
  }
  #phone::after {
    content: ""; position: absolute; right: -6px; top: 90px;
    width: 3px; height: 52px; border-radius: 2px; background: #3a4152;
  }
  /* landscape: the phone turned left (Android ROTATION_90) — the top edge, with the speaker and the camera, is on the left */
  #phone.land { padding: 10px 14px; }
  #phone.land::before { top: 50%; left: 5px; transform: translateY(-50%); width: 5px; height: 54px; }
  #phone.land::after { right: auto; top: -6px; left: 90px; width: 52px; height: 3px; }
  /* A real device's own look (f in DEVICES): body, bezels and keys are drawn in #frame, in portrait, and turned with the
     phone by apply(); the bezels become #phone's padding. A custom size and the generic devices keep the frame above. */
  #phone.look { border: 0; background: transparent; box-shadow: none; }
  #phone.look::before, #phone.look::after { display: none; }
  #frame { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
  #frame[hidden] { display: none; }
  #frame > div { position: absolute; }
  /* things on the glass itself (a foldable's crease, the light on curved edges): over the app, not in a shot or a video */
  #glass .ovl { position: absolute; z-index: 3; pointer-events: none; }
  #glass .ovl[hidden] { display: none; }
  /* bars, app and camera are placed by apply() (left/top/width/height in px) */
  #glass { border-radius: 14px; overflow: hidden; background: #1d1f21; position: relative; }
  #glass > #sysbar, #glass > #navbar, #glass > #scr { position: absolute; }
  /* viewport-fit=cover: the app fills the whole screen, the bars lie on top of it, transparent (Capacitor 8) */
  #glass.cover #sysbar, #glass.cover #navbar { z-index: 2; background: transparent; pointer-events: none; }
  #glass.cover #navbar .nb.act { pointer-events: auto; }
  /* gesture navigation in finger mode: no arrow cursor on the bars either (the ring shows where the finger is) */
  #glass.fgest { cursor: none; }
  /* back gesture: a round arrow at the edge, follows the finger; .go = far enough, letting go = back (as Android's) */
  #navArrow { position: absolute; z-index: 5; left: 0; top: 0; width: 40px; height: 40px; margin-top: -20px; border-radius: 50%;
              background: rgba(32,33,36,.92); display: grid; place-items: center; pointer-events: none; opacity: 0; transition: opacity .15s, transform .15s; }
  #navArrow i { width: 10px; height: 10px; border-left: 2.5px solid #e8eaed; border-bottom: 2.5px solid #e8eaed; transform: translateX(2px) rotate(45deg); }
  #navArrow.r i { transform: translateX(-2px) rotate(-135deg); }
  #navArrow.on { opacity: .75; }
  #navArrow.go { opacity: 1; transform: scale(1.12); }
  /* camera hole (punch-hole): above everything, as the real one is */
  #camhole { position: absolute; z-index: 4; width: 24px; height: 24px; border-radius: 50%; background: #000; box-shadow: 0 0 0 1.5px #2a2f3a; pointer-events: none; }
  /* iPhone mode: the notch / Dynamic Island instead of the hole (size, place and corners set in apply()) */
  #camhole.ios { box-shadow: none; }
  /* volume panel: shown for a moment at the right edge after a volume change, as on Android */
  #volpop { position: absolute; z-index: 5; top: 50%; transform: translateY(-50%); width: 36px; padding: 12px 0 10px; border-radius: 18px;
            background: rgba(32,33,36,.92); color: #e8eaed; display: flex; flex-direction: column-reverse; align-items: center; gap: 10px;
            opacity: 0; transition: opacity .25s; pointer-events: none; }
  #volpop.show { opacity: 1; }
  #volpop .track { width: 6px; height: 110px; border-radius: 3px; background: rgba(255,255,255,.22); position: relative; overflow: hidden; }
  #volpop .fill { position: absolute; left: 0; right: 0; bottom: 0; background: #8ab4f8; }
  /* vibration: zigzags beside the frame (outside the phone, in the sizer's margin), lit during each buzz; placed by apply() */
  .zig { position: absolute; width: 10px; height: 74px; pointer-events: none; opacity: 0;
         color: color-mix(in oklab, var(--color-base-content) 75%, transparent); }
  .zig.on { opacity: 1; }
  #screen { border: none; display: block; background: #fff; }
  /* finger mode: a thin ring = where the mouse would touch; a finger on the screen = the ring fills and grows a little,
     and on release the fill fades out slowly and spreads. Above the app and the bars, under the camera hole.
     Positions come from sim-bridge.js (app px). An <i> sits on the point (translate); its <b> is the look, centred on it. */
  /* #tv = over the app (app px); #tvg = over the whole screen, for a finger on the bars (gesture navigation) */
  .tv { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
  .tv i { position: absolute; left: 0; top: 0; }
  .tv b { position: absolute; width: 26px; height: 26px; left: -13px; top: -13px; border-radius: 50%; opacity: 0; }
  .tv .hv b { border: 1.5px solid rgba(255,255,255,.85); box-shadow: 0 0 0 1px rgba(0,0,0,.2), inset 0 0 0 1px rgba(0,0,0,.12); transition: opacity .15s; }
  .tv .hv.on b { opacity: 1; }
  .tv .dn b { background: rgba(255,255,255,.42); border: 1.5px solid rgba(255,255,255,.9); box-shadow: 0 0 0 1px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.18); transform: scale(.75); }
  .tv .dn.on b { opacity: 1; transform: scale(1.15); transition: opacity .12s ease-out, transform .22s cubic-bezier(.3,1.5,.5,1); }
  .tv .dn.off b { opacity: 0; transform: scale(1.6); transition: opacity .45s ease-out, transform .45s ease-out; }
  /* ⏸ Background / ⏻ Close: covers the screen, the app can no longer be touched */
  /* Keyboard: a picture over the bottom of the screen, above the navigation bar; the app's window ends at its top */
  #kbd { position: absolute; z-index: 3; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 7px 3px 9px; background: #1f2125; user-select: none; }
  #kbd.land { gap: 5px; }
  #kbd .kt { flex: 1; min-height: 0; display: flex; align-items: center; color: #9aa0a6; }
  #kbd .kt span { flex: 1 1 0; display: grid; place-items: center; }
  #kbd .kt b { font: 700 12px/1 "Segoe UI", sans-serif; letter-spacing: .5px; }
  #kbd .kt .mc { flex: 0 0 30px; height: 30px; margin: 0 calc((100% / 6 - 30px) / 2); border-radius: 50%; background: #3a3d44; color: #e8eaed; }
  #kbd.land .kt { display: none; }
  #kbd[hidden] { display: none; }
  #kbd .kr { flex: 1; min-height: 0; display: flex; justify-content: center; gap: 4px; }
  #kbd .kr i { flex: 1 1 0; max-width: 10.5%; display: grid; place-items: center; border-radius: 5px; background: #3a3d44; color: #e8eaed; font: 400 15px/1 "Segoe UI", sans-serif; }
  #kbd .kr i.w { flex-grow: 1.6; max-width: 16%; background: #2c2e33; font-size: 13px; }
  #kbd .kr i.sp { flex-grow: 6; max-width: 48%; }
  #kbd .kr i.go { background: #8ab4f8; color: #1f2125; }
  #kbd .kr i[data-k] { cursor: pointer; }
  #kbd.up .kr i { text-transform: uppercase; }
  #kbd .kr i.dn, #kbd.up .kr i[data-k="Shift"] { background: #5f6368; }
  #kbd .kr i.go.dn { background: #aecbfa; }
  /* FPS meter: under the status bar, on the right */
  #fps { position: absolute; z-index: 4; padding: 2px 6px; border-radius: 6px; background: rgba(0,0,0,.72); color: #7ee787; font: 600 11px/1.3 Consolas, monospace; pointer-events: none; }
  #fps[hidden] { display: none; }
  #fps.mid { color: #f2cc60; }
  #fps.low { color: #ff7b72; }
  #sysbar.offline .sb-r svg { opacity: .25; }   /* ⚙ → Internet off */
  /* Screenshot: for the moment of the shot the screen is a plain rectangle, as a phone saves it */
  #glass.shot { border-radius: 0 !important; }
  #glass.shot #camhole, #glass.shot .tv, #glass.shot #fps, #glass.shot #volpop, #glass.shot #navArrow, #glass.shot .ovl { visibility: hidden; }
  /* Screenshot "phone": the phone as it looks (corners, camera, the glass's own light), only the simulator's helpers hide.
     For a moment the stage turns black, then white: the two frames give the PNG its transparency. No shadow (no room at Fit) */
  #glass.shotP .tv, #glass.shotP #fps, #glass.shotP #volpop, #glass.shotP #navArrow { visibility: hidden; }
  body.shotK #stage { background: #000 !important; }
  body.shotW #stage { background: #fff !important; }
  body.shotK #info, body.shotW #info { visibility: hidden; }
  body.shotK #phone:not(.look), body.shotW #phone:not(.look), body.recP #phone:not(.look) { box-shadow: inset 0 0 0 2px #14161c !important; }
  body.shotK #frame, body.shotW #frame, body.recP #frame { --fsh: 0 0 #0000 !important; }
  body.recP #info { visibility: hidden; }
  /* Video, screen only: a plain rectangle, as a phone's own screen recording; the touch circles stay (as Android's "Show taps") */
  #glass.rec { border-radius: 0 !important; }
  #glass.rec #camhole, #glass.rec .ovl { visibility: hidden; }
  .recTime { min-width: 30px; padding: 0 3px; font: 600 11px/1 "Segoe UI", sans-serif; color: var(--color-error); font-variant-numeric: tabular-nums; }
  .recTime[hidden] { display: none; }
  /* Presentation mode: only the phone, on the plain background. Its controls (Lasha's pick „დ“, 2026-11-11): a faint dot in the window's
     top-left corner; the mouse on it opens a card with three big tiles. Hidden while a screenshot is taken (body.shotting) */
  body.present #bar, body.present #dev, body.present #info { display: none !important; }
  #presBar { display: none; position: fixed; top: 10px; left: 10px; z-index: 50; }
  body.present #presBar { display: block; }
  body.shotting #presBar { visibility: hidden !important; }
  #presDot { position: relative; display: block; width: 30px; height: 30px; padding: 0; border: 0; background: none; cursor: pointer; }
  #presDot::after { content: ""; position: absolute; left: 10px; top: 10px; width: 10px; height: 10px; border-radius: 50%;
                    background: color-mix(in oklab, var(--color-base-content) 24%, transparent); transition: background .15s; }
  #presDot:hover::after { background: color-mix(in oklab, var(--color-base-content) 50%, transparent); }
  #presBar.rec #presDot::after { background: var(--color-error); animation: presPulse 1.2s infinite; }
  @keyframes presPulse { 50% { opacity: .35; } }
  #presBar > .recTime { position: absolute; left: 30px; top: 9px; }
  #presBar.show > .recTime, #presBar.show #presDot { visibility: hidden; }
  #presCard { position: absolute; left: 0; top: 0; padding: 10px; border-radius: 12px; background: var(--color-base-200);
              border: 1px solid color-mix(in oklab, var(--color-base-content) 10%, transparent); box-shadow: 0 10px 30px rgba(0,0,0,.45);
              opacity: 0; pointer-events: none; transform: scale(.96); transform-origin: top left; transition: opacity .12s, transform .12s; }
  #presBar.show #presCard { opacity: 1; pointer-events: auto; transform: none; }
  .presHd, .presFt { font-size: 12px; line-height: 1.3; color: color-mix(in oklab, var(--color-base-content) 60%, transparent); white-space: nowrap; }
  .presHd { margin: 0 2px 8px; } .presFt { margin: 8px 2px 0; }
  .presFt kbd { font: 600 10px/1 Consolas, monospace; padding: 3px 5px; border-radius: 4px; background: color-mix(in oklab, var(--color-base-content) 8%, transparent); }
  .presRow { display: flex; gap: 6px; }
  .presTile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-width: 92px; height: 72px; padding: 0 8px;
              border: 0; border-radius: 8px; cursor: pointer; background: color-mix(in oklab, var(--color-base-content) 5%, transparent);
              color: var(--color-base-content); font-size: 13px; line-height: 1.2; white-space: nowrap; }
  .presTile:hover, .presTile.btn-active { background: color-mix(in oklab, var(--color-base-content) 12%, transparent); }
  .presTile.presEx:hover { background: color-mix(in oklab, var(--color-error) 18%, transparent); color: var(--color-error); }
  .presTile.text-error { color: var(--color-error); }
  .presTile .recTime { min-width: 0; padding: 0; font-size: 12px; }
  #bg { position: absolute; inset: 0; background: #0b0d11; color: #8a93a6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 500 14px/1.4 "Segoe UI", sans-serif; user-select: none; }
  #bg[hidden] { display: none; }
  /* Ads: the AdMob stand-in. Fixed colours: an ad does not follow the app's theme. Banner under the finger circles, interstitial over the bars (immersive) */

              background: rgba(0,0,0,.45); color: #fff; font-size: 18px; line-height: 1; cursor: pointer; }

  #adInt .ic { width: 84px; height: 84px; flex: none; border-radius: 20px; margin-top: -42px; border: 4px solid #fff; box-shadow: 0 4px 14px rgba(0,0,0,.2);

  /* a link opened another app (browser, Play Store, mail…): a stand-in for that app over the screen, our app is in the background */
  #bg .aw-ic { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: #1d2230; color: #c9d1e0; margin-bottom: 4px; }
  #bg .aw-ic svg { width: 24px; height: 24px; }
  #bg .aw-name { color: #e8eaed; font-size: 16px; font-weight: 600; }
  #bg .aw-url { max-width: 86%; margin-top: 4px; font: 12px/1.4 Consolas, monospace; color: #aab3c5; word-break: break-all; text-align: center; user-select: text;
                display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  #bg .aw-go { margin: 8px 0 6px; padding: 6px 12px; border: 0; border-radius: 8px; background: #2b3242; color: #e8eaed; cursor: pointer;
               font: 500 12px "Segoe UI", sans-serif; display: inline-flex; align-items: center; gap: 6px; }
  #bg .aw-go:hover { background: #353d51; }

  #sysbar {
    display: flex; align-items: center; justify-content: space-between;

    background: #1d1f21; color: #fff;
    font: 500 12px/1 "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums; user-select: none;
  }
  #sysbar .sb-l, #sysbar .sb-r { display: flex; align-items: center; gap: 6px; }
  #sysbar .sb-l { opacity: .9; font-size: 11px; }
  #sysbar svg { display: block; }
  #sysbar .bat { width: 20px; height: 10px; border: 1px solid #fff; border-radius: 2px; position: relative; display: inline-block; }
  #sysbar .bat::after { content: ""; position: absolute; right: -3px; top: 3px; width: 2px; height: 4px; border-radius: 0 1px 1px 0; background: #fff; }
  #sysbar .bat i { display: block; height: 100%; background: #fff; }

  /* iPhone mode (an iPhone or the iPad picked in the device list): the clock on the left, no notification icons, no percent */
  #sysbar .ios-only { display: none; }
  #sysbar.ios { padding: 0 30px 0 34px; font: 600 15px/1 -apple-system, "Segoe UI", sans-serif; }
  #sysbar.ios.flat { padding: 0 8px; font-size: 12px; }
  #sysbar.ios .and-only { display: none; }
  #sysbar.ios .ios-only { display: inline; }

  #navbar { height: 22px; background: #1d1f21; display: flex; align-items: center; justify-content: center; gap: 64px; user-select: none; }
  #navbar .pill { width: 108px; height: 4px; border-radius: 2px; background: #dfe3ea; }
  #navbar .btns { display: none; align-items: center; gap: 34px; }
  /* iPhone mode: the home indicator, 8 px from the bottom edge */
  #navbar.ios { align-items: flex-end; padding-bottom: 8px; }
  #navbar.ios .pill { width: 134px; height: 5px; border-radius: 3px; }
  #navbar.buttons { height: 44px; }
  #navbar.buttons .pill { display: none; }
  #navbar.buttons .btns { display: flex; }
  /* 3 buttons in landscape on a phone: a column on the right, ◁ at the bottom */
  #navbar.side .btns { flex-direction: column-reverse; gap: 34px; }
  /* each button = a 44×36 touch area; ◁ and ○ (.act) are pressable, with a soft circle while pressed (as Android's ripple); □ does nothing */
  #navbar .nb { width: 44px; height: 36px; display: grid; place-items: center; border-radius: 18px; }
  #navbar .nb.act { cursor: pointer; }
  #navbar .nb.act:active { background: rgba(255,255,255,.16); }
  #navbar .b-back { width: 0; height: 0; border: 7px solid transparent; border-right: 11px solid #dfe3ea; }
  #navbar .b-home { width: 14px; height: 14px; border: 2px solid #dfe3ea; border-radius: 50%; }
  #navbar .b-rec  { width: 13px; height: 13px; border: 2px solid #dfe3ea; border-radius: 2px; }
  /* Calibrate (Natural size): a bank card's outline at a trial ppi; calDraw() sets the sizes */
  #calCard { position: relative; flex-shrink: 0; border: 2px dashed var(--color-primary); background: color-mix(in oklab, var(--color-primary) 10%, transparent); }
  #calCard .emv { position: absolute; border-radius: 3px; background: color-mix(in oklab, var(--color-base-content) 22%, transparent); }
  #calCard .lbl { position: absolute; left: 0; right: 0; bottom: 10%; text-align: center; font-size: 13px; color: color-mix(in oklab, var(--color-base-content) 65%, transparent); }

<body class="h-full m-0 flex flex-col overflow-hidden bg-base-300 text-base-content">

  <!-- 1. Top bar: only what you press often, as icons (data-icon sets the drawing) in soft pill groups; the rest is under ⚙.
       Left: Open app (the folder icon), the phone and the app. Middle: ↻, right above the phone (a 4-column grid whose last column = the right console panel's width, set by dockApply()).
       Right: zoom, the console panel, ⓘ, ⚙. -->
  <div id="bar" class="shrink-0 grid items-center px-3 py-1.5 bg-base-200 border-b border-base-content/10" style="grid-template-columns: 1fr auto 1fr 400px">
    <div class="relative flex items-center gap-1.5">
      <span class="pill"><span class="tip"><button id="appBtn" class="btn btn-sm btn-ghost btn-square" data-icon="folderOpen"></button></span></span>
      <span class="pill">
        <span class="tip"><button id="back" class="btn btn-sm btn-ghost btn-square" data-icon="back"></button></span>
        <span class="tip"><button id="pause" class="btn btn-sm btn-ghost btn-square"></button></span>
        <span class="tip"><button id="kill" class="btn btn-sm btn-ghost btn-square"></button></span>
      </span>
      <span class="pill">
        <span class="tip"><button id="mute" class="btn btn-sm btn-ghost btn-square"></button></span>
        <span class="tip"><button id="touch" class="btn btn-sm btn-ghost btn-square"></button></span>
      </span>
      <!-- Capture: screenshot, video, presentation in their own group -->
      <span class="pill">
        <span class="relative inline-flex"><span class="tip"><button id="shot" class="btn btn-sm btn-ghost btn-square" data-icon="camera"></button></span>
          <!-- Screenshot: screen / phone / whole window. Opens on 📷, closes on a pick, a click outside or Esc -->
          <div id="shotBox" hidden class="absolute left-0 top-full mt-2 z-20 w-72 p-2 rounded-box bg-base-100 shadow-xl border border-base-content/10 text-sm">
            <ul id="shotMenu" class="menu w-full p-0 gap-0.5"></ul>
          </div></span>
        <span class="relative inline-flex"><span class="tip"><button id="rec" class="btn btn-sm btn-ghost btn-square"></button></span>
          <!-- Video: screen / phone. Opens on ⏺ (while it records, ⏺ stops instead), closes on a pick, a click outside or Esc -->
          <div id="recBox" hidden class="absolute left-0 top-full mt-2 z-20 w-72 p-2 rounded-box bg-base-100 shadow-xl border border-base-content/10 text-sm">
            <ul class="recMenu menu w-full p-0 gap-0.5"></ul>
          </div></span><span class="recTime" hidden></span>
        <span class="tip"><button id="present" class="btn btn-sm btn-ghost btn-square" data-icon="presentation"></button></span>
      </span>
      <!-- Open app: which app opens in the phone. The app's folder or an APK's web part (the buttons; on a web page only, see sim-sw.js),
           or a path / a file path pasted from Windows / an address in the field (Enter opens it).
           Opens on the folder icon, closes on a click outside or Esc, like ⚙ -->
      <div id="appBox" hidden class="absolute left-0 top-full mt-2 z-20 w-96 p-4 rounded-box bg-base-100 shadow-xl border border-base-content/10 text-sm flex flex-col gap-2">
        <div class="flex gap-2">
          <button type="button" id="appPick" class="btn btn-sm btn-primary flex-1" data-t="folderBtn"></button>
          <button type="button" id="apkPick" class="btn btn-sm btn-primary flex-1" data-t="apkBtn"></button>
        </div>
        <input type="file" id="apkFile" accept=".apk" hidden>
        <label for="appIn" class="text-xs text-base-content/60 mt-1" data-t="appOr"></label>
        <input type="text" id="appIn" class="input input-sm w-full" spellcheck="false" autocomplete="off">
        <p class="text-xs text-base-content/60 leading-relaxed mt-1" data-th="appWhat"></p>
        <p class="text-xs text-base-content/60 leading-relaxed" data-th="appDemo"></p>
      </div>
    </div>
    <span class="pill"><span class="tip"><button id="reload" class="btn btn-sm btn-ghost btn-square" data-icon="reload"></button></span></span>
    <span id="barGap"></span>
    <div class="relative flex items-center justify-end gap-1.5">
      <!-- Device: left of Zoom; custom W×H stays in ⚙ → Size -->
      <!-- Rotate sits in the Device group, left of the list: both change the phone's shape -->
      <span class="pill"><span class="tip tip-r"><button id="rotate" class="btn btn-sm btn-ghost btn-square"></button></span><span class="tip tip-r"><select id="device" class="select select-sm select-ghost w-auto min-w-0"></select></span></span>
      <!-- Zoom: one button with the scale; its panel = a slider 40-200 %, Fit · 50 · 100 · Natural
           and the screen line (Natural needs this screen's ppi → Calibrate). Opens / closes like ⚙ -->
      <span class="pill"><span class="tip tip-r"><button id="zoomBtn" class="btn btn-sm btn-ghost px-2 gap-1 font-normal text-xs tabular-nums"><span id="zoomVal" class="w-9 text-right"></span><span id="zoomChev" class="inline-flex opacity-60"></span></button></span></span>
      <div id="zoomBox" hidden class="absolute right-0 top-full mt-2 z-20 w-80 p-4 rounded-box bg-base-100 shadow-xl border border-base-content/10 text-sm flex flex-col gap-3">
        <div class="flex items-baseline justify-between gap-2"><span class="font-semibold" data-t="zoomT"></span><span id="zoomBig" class="text-2xl font-bold tabular-nums"></span></div>
        <input type="range" id="zoomRange" min="40" max="200" step="10" class="range range-sm range-primary">
        <div class="flex justify-between text-[11px] text-base-content/50 -mt-2 px-0.5"><span>40%</span><span>100%</span><span>200%</span></div>
        <div id="zoomChips" class="flex flex-wrap gap-1.5">
          <button class="btn btn-xs" data-z="fit" data-ic="scan"><span data-t="zFit"></span></button>
          <button class="btn btn-xs" data-z="0.5">50%</button>
          <button class="btn btn-xs" data-z="1">100%</button>
          <button class="btn btn-xs" data-z="nat" data-ic="monitor"><span data-t="zNat"></span></button>
        </div>
        <div class="flex items-center gap-2 text-xs text-base-content/60 border-t border-base-content/10 pt-3"><span id="zoomScrIc" class="inline-flex"></span><span id="zoomScr" class="flex-1 leading-snug"></span><button id="calBtn" class="btn btn-xs btn-ghost text-primary" data-t="calBtn"></button></div>
      </div>
      <!-- Console panel: where it sits (right / bottom) or hidden. The icon shows where it is now; a click opens the menu -->
      <span class="pill"><span class="tip tip-r"><button id="dockBtn" class="btn btn-sm btn-ghost btn-square"></button></span></span>
      <div id="dockBox" hidden class="absolute right-0 top-full mt-2 z-20 w-60 p-2 rounded-box bg-base-100 shadow-xl border border-base-content/10 text-sm">
        <ul id="dockMenu" class="menu w-full p-0 gap-0.5"></ul>
      </div>
      <span class="pill">
        <span class="tip tip-r"><button id="helpBtn" class="btn btn-sm btn-ghost btn-square" data-icon="info"></button></span>
        <span class="tip tip-r"><button id="optsBtn" class="btn btn-sm btn-ghost btn-square" data-icon="settings"></button></span>
      </span>
      <!-- ⚙ Settings: opens on ⚙, closes on a click outside or Esc -->
      <div id="opts" hidden class="absolute right-0 top-full mt-2 z-20 w-96 p-4 rounded-box bg-base-100 shadow-xl border border-base-content/10 text-sm grid grid-cols-[auto_minmax(0,1fr)] gap-x-3 gap-y-2 items-center [&>label]:whitespace-nowrap">
        <label for="cw" data-t="size"></label>
        <div class="flex items-center gap-1.5"><input type="number" id="cw" min="200" max="2000" class="input input-sm w-[76px]"> × <input type="number" id="ch" min="200" max="2000" class="input input-sm w-[76px]"> <span class="text-xs text-base-content/50">px</span></div>
        <label for="bars" data-t="bars"></label>
        <select id="bars" class="select select-sm w-full">
          <option value="gesture" data-t="gesture"></option>
          <option value="buttons" data-t="buttons"></option>
          <option value="off" data-t="off"></option>
        </select>
        <label for="cut" data-t="cut"></label>
        <input type="checkbox" id="cut" class="toggle toggle-sm">
        <label for="themeSel" data-t="theme"></label>
        <select id="themeSel" class="select select-sm w-full"></select>
        <label for="vol" data-t="vol"></label>
        <div class="flex items-center gap-2"><input type="range" id="vol" min="0" max="15" step="1" class="range range-xs flex-1 min-w-0"><span id="volVal" class="text-xs tabular-nums w-10 text-right"></span></div>
        <label for="adsSel" data-t="ads"></label>
        <select id="adsSel" class="select select-sm w-full">
          <option value="fill" data-t="adsFill"></option>
          <option value="none" data-t="adsNone"></option>
        </select>
        <label for="touchLog" data-t="touchLog"></label>
        <input type="checkbox" id="touchLog" class="toggle toggle-sm">
        <label for="netOn" data-t="net"></label>
        <input type="checkbox" id="netOn" class="toggle toggle-sm">
        <label for="fontSel" data-t="fontSize"></label>
        <select id="fontSel" class="select select-sm w-full"><option value="100">100%</option><option value="130">130%</option><option value="200">200%</option></select>
        <label for="fpsOn" data-t="fps"></label>
        <input type="checkbox" id="fpsOn" class="toggle toggle-sm">
        <label for="recSound" data-t="recSound"></label>
        <input type="checkbox" id="recSound" class="toggle toggle-sm">
        <!-- the language label stays in English in both languages, so anyone can find it -->
        <label for="langSel">Language</label>
        <select id="langSel" class="select select-sm w-full"></select>
      </div>
    </div>
  </div>

  <!-- Phone note: a browser that cannot capture the tab (a phone's) is told the full version needs a computer, and what does not
       work there. Shown by the script (noCap); ✕ = gone for good (<KEY>-sim-pcnote) -->

    <span id="pcNoteIc" class="inline-flex shrink-0 mt-px text-warning"></span><span class="flex-1" data-t="pcNote"></span>
    <button type="button" id="pcNoteX" class="btn btn-xs btn-ghost btn-square -my-1" data-ta="close">✕</button>
  </div>

  <!-- Presentation mode's corner control (Lasha's pick „დ“, 2026-11-11): a faint dot in the window's top-left corner (+ the time while

  <div id="presBar">
    <button id="presDot" type="button" data-ta="presDot"></button><span class="recTime" hidden></span>

      <div class="presHd" data-t="presHead"></div>

        <span class="relative inline-flex"><button id="presRec" type="button" class="presTile"></button>

            <ul class="recMenu menu w-full p-0 gap-0.5"></ul>
          </div></span>
        <span class="relative inline-flex"><button id="presShot" type="button" class="presTile"></button>
          <div id="presShotBox" hidden class="absolute left-0 top-full mt-2 z-20 w-72 p-2 rounded-box bg-base-100 shadow-xl border border-base-content/10 text-sm">
            <ul class="menu w-full p-0 gap-0.5"></ul>
          </div></span>
        <button id="presExit" type="button" class="presTile presEx"></button>
      </div>
      <div class="presFt"><kbd>Esc</kbd> <span data-t="presEsc"></span></div>
    </div>

                <rect x="4"  y="6"  width="3" height="6"  rx=".5"/>
                <rect x="8"  y="3"  width="3" height="9"  rx=".5"/>
                <rect x="12" y="0"  width="3" height="12" rx=".5"/>

      <button type="button" id="infoBtn" data-ta="infoBtn"></button>

    <!-- 3. Console: right of the phone or under it, or hidden (dockApply). Its inner edge (#grip) drags = size, double click = default size.
         Head: show / hide the command line, search (the icon opens the field), ⋮ = copy / save as .txt / clear; under it the filter chips -->
    <section id="dev" class="relative shrink-0 bg-base-200 border-base-content/10 flex flex-col min-h-0 min-w-0">
      <div id="grip"></div>
      <div class="shrink-0 border-b border-base-content/10 text-xs text-base-content/60 select-none">
        <div class="flex items-center gap-2 px-3 py-1.5">
          <!-- Two tabs: the console, and the app's saved data (localStorage) -->

      ["folderOpen", "აპის გახსნა", "ზოლის პირველი ღილაკი: რომელი აპი გაიხსნას ტელეფონში. ხსნის პატარა პანელს, იხურება გარეთ დაჭერით ან Esc-ით. <b>საქაღალდის არჩევა…</b> = აირჩიე აპის საქაღალდე (<code>index.html</code>, ან <code>www/</code> ან <code>dist/</code>) და აპი იქიდან გაიხსნება; <code>sim-bridge.js</code> თვითონ ემატება, ↻ შენს შესწორებებს აჩვენებს, გვერდის refresh-ზე საქაღალდე ავიწყდება. <b>APK-ის არჩევა…</b> = Android-ის აპის ფაილი (<code>.apk</code>): იხსნება მისი ვებ-ნაწილი (<code>assets/public/</code>: Capacitor, <code>assets/www/</code>: Cordova, Construct 2); ნატიური აპი (Java / Kotlin, Unity, Flutter) არ იხსნება, ამას კონსოლი იტყვის. ორივე ღილაკი მუშაობს მხოლოდ ვებ-გვერდად გახსნილ სიმულატორში (ცოცხალი დემო ან ლოკალური სერვერი), Chrome-ში ან Edge-ში. ქვემოთ ველში: გზა <code>sim.html</code>-დან (მაგ. <code>myapp/index.html</code>), ფაილის გზა Windows-იდან (Shift + მარჯვენა ღილაკი ფაილზე → Copy as path) ან მისამართი (მაგ. <code>http://localhost:5173</code>), მერე Enter. ცარიელი = საწყისი აპი, ან ცარიელი ტელეფონი, თუ საწყისი აპი არ არის. მისამართის ზოლში ჩაიწერება, ასე რომ refresh-ზე ისევ ის გაიხსნება. ფაილის გზა მუშაობს მხოლოდ მაშინ, როცა სიმულატორი თვითონაც ფაილიდანაა გახსნილი. ველიდან გახსნილ აპს <code>sim-bridge.js</code> სჭირდება, თორემ მხოლოდ ჩარჩოში ჩანს. პანელის ბოლოს: დემო-აპი zip-ად, საცდელად."],
      ["back", "უკან", "ტელეფონის „უკან“ ღილაკი; იგივეა ◁ ტელეფონზე (3 ღილაკის რეჟიმში) და კიდიდან გასრიალება (ჟესტების რეჟიმში). რას ნიშნავს, აპი წყვეტს: წინა ეკრანი, ფანჯრის დახურვა ან არაფერი. ფონზე ან გათიშულ აპს არ გადაეცემა."],
      ["pause", "ფონზე", "თითქოს Home დააჭირე ან სხვა აპზე გადახვედი. აპი იგებს, რომ დამალულია, ანიმაციები ჩერდება. ეკრანს ფარდა ფარავს. იგივეა ○ ტელეფონზე (3 ღილაკის რეჟიმში)."],
      ["play", "დაბრუნება", "აპი ფონიდან ბრუნდება. იქიდან უნდა გააგრძელოს, სადაც იყო."],
      ["power", "გათიშვა / გახსნა", "თითქოს აპი ბოლო აპების სიიდან ჩამოასრიალე, ან ტელეფონმა მეხსიერებისთვის დახურა. აპი გაფრთხილებას <b>არ</b> იღებს: რაც არ შეინახა, იკარგება. შემდეგი დაჭერა („გახსნა“) აპს თავიდან რთავს, რჩება მხოლოდ შენახული."],
      ["rotP", "დატრიალება", "ვერტიკალური ↔ ჰორიზონტალური. იკონკაზე მკრთალი ეკრანი = ახლა, მუქი = დაჭერის მერე. სიმულატორს ახსოვს."],
      ["vol2", "ხმის გათიშვა", "აპის ყველა ხმა ერთად ჩუმდება; ღილაკი ივსება, სანამ ხმა გათიშულია. ტალღები იკონკაზე = ახლანდელი დონე. დონე: ⚙ → ხმა."],
      ["pointer", "თითი / მაუსი", "ეკრანზე მაუსი თითია ან ჩვეულებრივი მაუსი. დაწვრილებით: ტაბი „თითი და ზუმი“."],
      ["camera", "სქრინშოტი", "ღილაკი ხსნის მენიუს; თითოეული არჩევანი PNG ფაილს ჩამოტვირთავს. <b>ეკრანი</b>: მარტო ტელეფონის ეკრანი (სისტემის ზოლებით, კამერისა და მომრგვალებული კუთხეების გარეშე). კონსოლი წერს ზომას და ჯდება თუ არა Google Play-ს წესში: თითო გვერდი 320–3840 px, გრძელი გვერდი მოკლეზე არა უმეტეს 2-ჯერ. 360 × 800 ძალიან გრძელია; ⚙ → ზომა 360 × 640 ჯდება. <b>ტელეფონი</b>: ტელეფონი ჩარჩოთი და კამერით, გამჭვირვალე ფონზე, ჩრდილის გარეშე. დაახლოებით ერთი წამით ფონი შავდება, მერე თეთრდება: ეს ორი კადრი ფაილს გამჭვირვალობას აძლევს. <b>მთელი ფანჯარა</b>: სიმულატორი, როგორც ჩანს. ბრაუზერი ყოველ ჯერზე ნებართვას გკითხავს: აირჩიე <b>ეს ჩანართი</b>. გადაღებისთვის Chrome ჩანართს ორჯერ უფრო მკვეთრად ხატავს, ამიტომ ფაილი ორჯერ დიდია, ვიდრე ტელეფონი ეკრანზე ჩანს; კიდევ მეტი გინდა, გაზარდე მასშტაბი (ეკრანისა და ტელეფონისთვის ტელეფონი მთლიანად უნდა ჩანდეს). მუშაობს Chrome-ში და Edge-ში."],
      ["video", "ვიდეო", "ტელეფონი ვიდეოფაილად. დაჭერა = მენიუ; არჩევა = ჩაწერა იწყება: ბრაუზერი ნებართვას გკითხავს, აირჩიე <b>ეს ჩანართი</b>. სანამ იწერება, ღილაკი წითელია და გვერდით დრო ჩანს. კიდევ დაჭერა = ჩერდება და ფაილი ჩამოიტვირთება; ბრაუზერის „Stop sharing“-იც აჩერებს და ინახავს. <b>ეკრანი</b>: მხოლოდ ეკრანი (სისტემის ზოლებით და თითის წრეებით, კამერისა და მომრგვალებული კუთხეების გარეშე). <b>ტელეფონი</b>: ტელეფონი ჩარჩოთი და კამერით, ჩრდილის გარეშე, გვერდის ფონზე (MP4 გამჭვირვალე ვერ იქნება), თითის წრეებით. ჩაწერისას დატრიალება, მოწყობილობა და ზომა არ იცვლება, მასშტაბი იცვლება. ორივე მუშაობს <b>პრეზენტაციის რეჟიმშიც</b>. ფორმატი: MP4, თუ ბრაუზერს შეუძლია, თორემ WEBM. ხმა: ⚙ → ხმა ვიდეოში. კონსოლი წერს ზომას, ხანგრძლივობას, ფორმატს და MB-ს."],
      ["presentation", "პრეზენტაციის რეჟიმი", "იმალება ზედა ზოლი, კონსოლი და ხაზი ტელეფონის ქვეშ; რჩება მხოლოდ ტელეფონი, ფანჯრის შუაში. ტელეფონი ჩვეულებრივ მუშაობს. ზედა მარცხენა კუთხეში მკრთალი წერტილია: მაუსი წერტილზე = ბარათი სამი ღილაკით: <b>ვიდეო</b>, <b>სქრინშოტი</b> (იგივე მენიუები, რაც ზედა ზოლში) და <b>გამოსვლა</b>; მაუსი რომ წავა, 0.8 წამში ისევ წერტილად იკეცება. შესვლისას ბარათი რამდენიმე წამით ჩანს. ჩაწერისას წერტილი წითლად ციმციმებს და გვერდით დრო ჩანს. წერტილი და ბარათი სქრინშოტსა და ვიდეოში არ ჩანს. Esc-იც გამოდის, თუ აპი არ არის მონიშნული (ჯერ ტელეფონის გარეთ დააჭირე). მასშტაბი რჩება, რომლითაც შეხვედი. არ ინახება: refresh = ჩვეულებრივი ხედი. თუ ვიდეო აქ დაიწყო, გამოსვლა ჩაწერას აჩერებს და ფაილს ინახავს."],
      ["reload", "გადატვირთვა", "ზოლის შუაში, ტელეფონის თავზე. აპი თავიდან იტვირთება. კონსოლი ხაზებს ინარჩუნებს, ასე „მანამდე“ და „მერე“ შეგიძლია შეადარო."],
      ["smartphone", "მოწყობილობა", "მასშტაბის მარცხნივ. რომელი ტელეფონი ან ტაბლეტი, მწარმოებლის მიხედვით: Samsung (დასაკეციც, დაკეცილი / გაშლილი), Pixel, iPhone, iPad და ზოგადი ზომები (ძველი პატარა Android, მაღალი ეკრანი, პატარა ტაბლეტი); თითო ჯგუფში ახალი ზემოთაა. პირველ გახსნაზე Pixel 6 Pro ჩანს, მერე ბოლოს არჩეული. ნამდვილი მოწყობილობა თავისი ჩარჩოთი ჩანს: კორპუსი, ღილაკები, ხვრელი ან ჭრილი თავის ადგილზე. iPhone ან iPad = iPhone-ის რეჟიმი: iOS-ის ზოლები და დაშორებები, ◁ ○ □-ის ნაცვლად ქვედა ხაზი, სისტემური „უკან“ არ არსებობს (⚙-ში ზოლები და კამერა ითიშება). რიცხვები (მაგ. 360×800) = ზომა, რასაც აპი „ხედავს“, არა ეკრანის ნამდვილი პიქსელები. სიაში თუ არ არის, შენი ზომა: ⚙ → ზომა."],
      ["100%", "მასშტაბი", "ტელეფონის ზომა მონიტორზე. ღილაკზე ახლანდელი მასშტაბი წერია, დაჭერა = პანელი: სლაიდერი 40-200%, ჩატევა · 50% · 100% · ნატურალური. დაწვრილებით: ტაბი „თითი და ზუმი“."],
      ["panelRight", "კონსოლის პანელი", "სად იყოს კონსოლი: <b>ავტომატური</b> (თავიდან ასეა: ტელეფონის მარჯვნივ, ან ქვემოთ, როცა ფანჯარა სიგანეზე მაღალია, მაგ. ვერტიკალური მონიტორი), <b>მარჯვნივ</b> (ვერტიკალური, ტელეფონის გვერდით), <b>ქვემოთ</b> (ჰორიზონტალური, ტელეფონის ქვეშ) ან <b>დამალული</b>. იკონკა აჩვენებს, სადაა ახლა; დაჭერა მენიუს ხსნის. ზომა: გადაათრიე პანელის შიდა კიდე (სიგანე 260–900 px, სიმაღლე 120 px-დან ფანჯრის 60 %-მდე). კიდეზე ორჯერ დაჭერა ან მენიუში „საწყისი ზომა“ = 400 / 260 px. სიმულატორს ახსოვს. ვიწრო ფანჯარაში (800 px-ზე ნაკლები: ტელეფონი, ვერტიკალურად დაჭერილი ტაბლეტი) კონსოლი ქვემოთ ვიწრო ზოლია: ისარი ან ტაბი მას ფანჯრის ნახევარზე შლის, ისარი კეცავს."],
      ["info", "ინფორმაცია", "ეს ფანჯარა. იხურება ✕-ით, Esc-ით ან გარეთ დაჭერით."],
      ["settings", "პარამეტრები", "ხსნის ⚙ პანელს. დაწვრილებით: ტაბი „პარამეტრები“."] ] },
    { id: "touch", ic: "pointer", name: "თითი და ზუმი", intro: "თითის რეჟიმი თავიდანვე ჩართულია. ტელეფონის ეკრანზე მაუსი თითად იქცევა და აპი ნამდვილ შეხებებს იღებს. ეკრანის გარეთ მაუსი ჩვეულებრივია.", items: [

      ["move", "გადათრევა", "დაჭერილი თითი სრიალებს; სია ან გვერდი მის ქვეშ ისქროლება. ~10 px-ზე მეტი გადაადგილება დაჭერად აღარ ითვლება."],
      ["moveH", "ტრიალა = ორი თითი", "კურსორის ორივე მხარეს ორი წრე. ზემოთ ტრიალი = შორდებიან (გადიდება), ქვემოთ = ახლოვდებიან (დაპატარავება). ტრიალას გაჩერებიდან ცოტა ხანში თითები აიწევს."],
      ["mouse", "მაუსის რეჟიმი", "თითის ღილაკზე დაჭერა. ეკრანზეც ჩვეულებრივი მაუსი, იმისთვის, რასაც „ყალბი“ თითი ვერ აკეთებს: ჩამოსაშლელი სია, სლაიდერი, ტექსტის მონიშვნა."],
      ["100%", "მასშტაბი", "ღილაკი ზედა ზოლში, დაჭერა = პანელი. <b>ჩატევა</b> = ტელეფონი ფანჯარაში ეტევა, მაქსიმუმ 100%. <b>სლაიდერი</b> = 40-დან 200%-მდე, 10%-ით; 50% და 100% ღილაკებიცაა. <b>ნატურალური</b> = ნამდვილი ზომა: ტელეფონი ეკრანზე ისეთივეა, როგორიც ხელში (ნამდვილი მოწყობილობა თავისი კორპუსის მილიმეტრებით, ზოგადი ზომა ან შენი ზომა = Android-ის 160 dp ინჩზე); ღილაკზე მაშინ 1:1 წერია. ამისთვის სიმმა ეკრანის სიმკვრივე უნდა იცოდეს: პანელის ქვედა ხაზი → <b>გასწორება</b>: საბანკო ბარათი ეკრანზე მიადე და კონტური დაამთხვიე (ბარათის გარეშე: სახაზავი, კონტური = 85.6 × 54 მმ). ინახება თითო ეკრანზე ცალკე; უცნობ ეკრანზე „ნატურალური“ ჯერ გასწორებას ხსნის. Windows-ის მასშტაბი და ბრაუზერის Ctrl +/− ზომას არ არევს. თუ ტელეფონი არ ეტევა, ასქროლე scrollbar-ით ან ტრიალით ეკრანის გარეთ. აპს არაფერი ეცვლება."],

    { id: "settings", ic: "settings", name: "პარამეტრები", intro: "⚙ ხსნის პანელს. იხურება გარეთ დაჭერით ან Esc-ით. ყველა არჩევანი ემახსოვრება.", items: [
      ["scaling", "ზომა", "ჩაწერე შენი სიგანე × სიმაღლე, თუ შენი ტელეფონი ზედა ზოლის სიაში (მოწყობილობა) არ არის."],
      ["panelBottom", "ზოლები", "ტელეფონის ზედა (საათი, ბატარეა) და ქვედა ზოლი. <b>ჟესტები</b> = თხელი ხაზი ქვემოთ, როგორც ახალ ტელეფონებზე; თითის რეჟიმში: მარცხენა ან მარჯვენა კიდიდან შიგნით გასრიალება = უკან (კიდესთან ისარი ჩნდება; მოკლე გასრიალება არაფერს აკეთებს), ქვედა ხაზიდან ზემოთ = ფონზე (home). ასეთ შეხებას აპი აღარ იღებს (touchcancel), როგორც ტელეფონზე. <b>3 ღილაკი</b> = ◁ ○ □: ◁ = უკან, ○ = ფონზე (home), □ არაფერს აკეთებს; ჰორიზონტალურ ტელეფონზე (არა ტაბლეტზე) მარჯვნივ გადადის. <b>გარეშე</b> = სრულეკრანიანი თამაში, ზოლები დამალულია. თავიდან: 3 ღილაკი."],
      ["circleDot", "კამერის ხვრელი", "წინა კამერის ხვრელი ეკრანში, თავიდან ჩართულია. ვერტიკალურად ზემოთაა, ჰორიზონტალურად მარცხნივ. ეკრანის ზოლს ფარავს, ზოლები დამალულიც რომ იყოს."],
      ["palette", "თემა", "ფერების ნაკრები (ღია, მუქი და სხვა) იმ აპებისთვის, რომლებიც თემებს იყენებენ. აპი ფერებს მაშინვე ცვლის."],
      ["vol2", "ხმა", "ტელეფონის ხმის ღილაკები: 0-დან 15-მდე, როგორც Android-ზე. აპის ყველა ხმას (მუსიკა, ეფექტები) ერთად ცვლის, ტელეფონზე ხმის ზოლი წამით ჩანს. აპს ამაზე არაფერი ეუბნება. სლაიდერის გაძრავა ხმას რთავს."],
      ["megaphone", "რეკლამა", "<b>მოდის</b> = აპი სატესტო რეკლამას იღებს. <b>არ მოდის</b> = ყოველი ჩატვირთვა „No fill“-ით ვარდება, როგორც ინტერნეტის გარეშე ან როცა საჩვენებელი არაფერია. ასე შეამოწმებ, რომ აპი რეკლამის გარეშეც მუშაობს. მოქმედებს მხოლოდ AdMob-იან აპზე (ტაბი „აპის შემქმნელს“)."],
      ["pointer", "შეხებები კონსოლში", "თავიდან ჩართულია. თითის რეჟიმში ყოველი ჟესტი კონსოლში ერთ ხაზად იწერება: <b>შეხება</b> x, y · <b>ორმაგი შეხება</b> · <b>გასრიალება</b> (ისარი = საით წავიდა თითი, მანძილი, დრო) · <b>გადახვევა</b> (ბრაუზერმა თვითონ გადაახვია) · <b>ორი თითი</b>: გაშლა / შეკუმშვა × · <b>ჟესტი</b> კიდიდან / ქვემოდან (ჟესტების რეჟიმში). ბოლოში = ელემენტი, რომელსაც თითი მოხვდა. ფილტრში: „შეხებები“."],
      ["globe", "ინტერნეტი", "გათიშული = თითქოს ტელეფონს ინტერნეტი არ აქვს. აპის საკუთარი ფაილები იტვირთება (APK-ში ისინი ტელეფონშია), მაგრამ <b>სხვა მისამართზე</b> მოთხოვნა (<code>fetch</code>, <code>XMLHttpRequest</code>) ვერ გადის, <code>navigator.onLine</code> = false, აპი იღებს <code>offline</code> / <code>online</code> მოვლენას, რეკლამა არ მოდის. ზედა ზოლში ანტენა და Wi-Fi ფერმკრთალდება. სურათები და სკრიპტები, რომლებიც HTML ტეგით იტვირთება, არ ჩერდება."],
      ["type", "შრიფტის ზომა", "Android-ის პარამეტრი „შრიფტის ზომა“. ტელეფონზე WebView ტექსტს მის მიხედვით ადიდებს, ჩარჩოები კი იგივე რჩება, ამიტომ ტექსტი შეიძლება აღარ ჩაეტიოს. 130% და 200% აჩვენებს, სად იშლება განლაგება. canvas-ში დახატული ტექსტი არ იცვლება. მიახლოებითია: px-ში მოცემული სტრიქონის სიმაღლე არ იზრდება."],
      ["gauge", "FPS მთვლელი", "რიცხვი ეკრანის კუთხეში: წამში რამდენ კადრს ხატავს აპი და ბოლო ნახევარ წამში ყველაზე გრძელი კადრი (ms). მწვანე = 55+, ყვითელი = 30+, წითელი = ნაკლები. კომპიუტერი ტელეფონზე სწრაფია: რაც აქ ჭედავს, ტელეფონზე უარესი იქნება; რაც აქ კარგია, ტელეფონზე მაინც შესამოწმებელია."],
      ["video", "ხმა ვიდეოში", "თავიდან ჩართულია. ვიდეოს ჩაწერისას აპის ხმაც იწერება (მუსიკა, ეფექტები), ⚙ → ხმის დონით. ბრაუზერის კითხვაში ჩანართის ხმის გაზიარება უნდა იყოს ჩართული; თუ არა, ვიდეო ხმის გარეშე იწერება და კონსოლი ამას წერს."],
      ["languages", "ენა (Language)", "პანელის ბოლო ხაზი, წარწერა Language. სიმულატორის საკუთარი წარწერები: ქართული ან English. ერთი არჩევანია ყველა პროექტისთვის. ტელეფონში აპს არაფერი ეცვლება."] ] },
    { id: "screen", ic: "terminal", name: "ეკრანი და კონსოლი", intro: "ხაზი ტელეფონის ქვეშ გეუბნება, რას იღებს აპი ახლა (ვიწრო ფანჯარაში, მაგ. ტელეფონზე, ის ტელეფონის ქვედა მარჯვენა კუთხესთან ფერმკრთალ ⓘ-შია: შეეხე). მაგალითად:<br><span class=\"eg\">Galaxy A15, ტიპური · 360 × 800 · აპი 360 × 800 · ზოლების ქვეშ: ↑28 ↓22 ←0 →0 · 75%</span>", items: [
      ["smartphone", "360 × 800", "ეკრანის ზომა."],
      ["scaling", "აპი 360 × 800", "სივრცე, სადაც აპი ხატავს."],
      ["panelTop", "ზოლების ქვეშ ↑ ↓ ← →", "რამდენს ფარავს ზოლი ან კამერა თითო კიდეზე (ზემოთ, ქვემოთ, მარცხნივ, მარჯვნივ). ღილაკები და ტექსტი ამ ზოლებს უნდა მოერიდოს. თუ ეს ნაწილი არ ჩანს, აპი ზოლების ქვეშ საერთოდ არ ხვდება, მისი სივრცე უბრალოდ პატარაა."],
      ["100%", "75%", "რა ზომითაა ტელეფონი ნაჩვენები: ჩატევა, შენი მასშტაბი ან ნატურალური. აპზე არ მოქმედებს."],
      ["terminal", "კონსოლი", "აპის დღიური: რას დააჭირა მომხმარებელმა, რომელი ეკრანი გაიხსნა. ხაზებს აპი თვითონ წერს: <code>log()</code>-ით ან ჩვეულებრივი <code>console.log</code> / <code>warn</code> / <code>error</code>-ით (ობიექტი მოკლე ტექსტად ჩანს; ბრაუზერის კონსოლშიც მიდის). სიმულატორიც ამატებს თავისას: უკან, ფონზე, გათიშვა, გადატვირთვა, თემა, ხმა, ვიბრაცია, ბმული, რეკლამა, ენა, თითი / მაუსი, და თითოეული შეხება (⚙ → შეხებები კონსოლში). ბოლო 5000 ხაზი რჩება. სად დგას და რა ზომისაა: ტაბი „ღილაკები“ → კონსოლის პანელი."],
      ["vibrate", "ვიბრაცია", "როცა აპი ვიბრირებს (<code>navigator.vibrate</code>, Capacitor-ის Haptics), ტელეფონის ორივე გვერდზე ზიგზაგი ინთება, რიტმის თითო ვიბრაციაზე; კონსოლი რიტმს ms-ში წერს. 80 ms-ზე მოკლე ვიბრაციაც 80 ms ჩანს. ეკრანზე პირველ შეხებამდე ვიბრაცია იბლოკება, როგორც ტელეფონის Chrome-ში (კონსოლი გაგაფრთხილებს)."],
      ["link", "ბმულები", "ბმული სხვა მისამართზე (არა აპის საკუთარ გვერდზე) ტელეფონზე აპში არ იხსნება: Capacitor მას Android-ს გადასცემს, იხსნება ის აპი, ვისიცაა, ჩვენი კი ფონზე გადადის. სიმულატორშიც ასეა: ეკრანზე ჩნდება ის აპი (ბრაუზერი, Play Store, ფოსტა, დარეკვა, შეტყობინებები, რუკა) და მისამართი, კონსოლი ბმულს წერს. ◁ აპს აბრუნებს. ვებ-მისამართს ღილაკი კომპიუტერზეც ხსნის. სხვა აპის საკუთარი ბმული (მაგ. <code>whatsapp:</code>) ტელეფონზე მხოლოდ მაშინ იხსნება, თუ ის აპი აყენია, თორემ არაფერი ხდება: აპი ადგილზე რჩება, კონსოლი გაგაფრთხილებს. იჭერს დაჭერილ ბმულს (<code>target=\"_blank\"</code>-იანსაც), <code>location.href</code>-ს და <code>window.open</code>-ს."],

      ["smartphone", "APK", "ეშვება მხოლოდ ვებ-ნაწილი. ნატიური plugin-ები (კამერა, ფაილები, შეტყობინებები და სხვ.) აქ არ არის, მხოლოდ სიმულატორის ნაცვლები: რეკლამა, ვიბრაცია, გასვლა. Cordova-ს ნატიურ გამოძახებებს პასუხი არ მოსდის (კონსოლი თითოს ერთხელ წერს), ასე რომ ძველი აპი შეიძლება იქ გაჩერდეს, სადაც ტელეფონზე მუშაობს."] ] },
    { id: "build", ic: "code", name: "აპის შემქმნელს", intro: "ეს ტაბი მათთვისაა, ვინც აპს აკეთებს.", items: [
      ["code", "sim-bridge.js", "აპის <code>&lt;head&gt;</code>-ში ერთი ხაზი. მის გარეშე აპი ჩანს, მაგრამ უკან, ფონზე, ხმა, თითი, ვიბრაცია, ბმულები, რეკლამა, ზოლების ზომები, კონსოლი და თემები მას არ მიდის, კონსოლი წერს, რომ აპი არ პასუხობს. <code>app.html</code> (ცარიელი საწყისი აპი) და დემო (<code>demo/</code>) უკვე შეიცავს."],
      ["shieldCheck", "ტელეფონზე უვნებელია", "სიმულატორის გარეთ bridge არაფერს აკეთებს, ასე რომ იგივე ფაილი უცვლელად ხდება Android-ის აპი."],
      ["megaphone", "რეკლამა კოდში", "AdMob plugin: <code>@capacitor-community/admob</code>. აპი მას ერთი ხაზით იღებს: <code>var AdMob = window.Capacitor &amp;&amp; Capacitor.isNativePlatform() ? Capacitor.Plugins.AdMob : window.simAdMob;</code> ტელეფონზე ნამდვილი plugin პასუხობს, სიმულატორში bridge-ის ნაცვალი, იგივე ბრძანებებით და მოვლენებით (showBanner, hideBanner, resumeBanner, removeBanner, prepareInterstitial, showInterstitial, addListener). ნიმუში: დემოს <code>ads.js</code>."],
      ["appWindow", "ცალკე აპად", "Chrome-ში და Edge-ში სიმულატორი ცალკე აპად დგება (<b>Phone Sim</b>): დაყენების ხატულა მისამართის ზოლის მარჯვნივ, ან Chrome-ის ⋮ მენიუ. იხსნება საკუთარ ფანჯარაში, აქვს ხატულა Start მენიუში და ინტერნეტის გარეშეც მუშაობს (ერთხელ უნდა იყოს გახსნილი ონლაინ). მუშაობს ვებ-გვერდად გახსნილ სიმულატორზე (ცოცხალი დემო ან ლოკალური სერვერი), არა ფაილიდან. პროექტის ასლი რომ დადგეს, <code>manifest.webmanifest</code> და <code>icons/</code> საქაღალდეც დააკოპირე."],
      ["link", "სხვა პროგრამიდან", "დაყენებული აპი ხსნის ბმულს <code>web+phonesim:</code> + აპის მისამართი, მაგ. <code>web+phonesim:http://localhost:5500/</code>. ნებისმიერი პროგრამა (VS Code, ტერმინალი), რომელიც ამ ბმულს გახსნის, აპს სიმულატორის ფანჯარაში აჩვენებს; ღია ფანჯარა ხელახლა გამოიყენება, იგივე აპი თავიდან იტვირთება. პირველად Chrome შეიძლება გკითხოს, გახსნას თუ არა Phone Sim. VS Code-ის მზა task: <code>README.md</code>. სიმულატორი ვებიდან და აპი ამ კომპიუტერზე (localhost): Chrome ერთხელ ნებართვას ითხოვს მისამართის ზოლის ქვეშ; სანამ არ დაუშვებ, ტელეფონი თეთრია (4 წამში კონსოლი შეგახსენებს)."],
      ["copy", "საკუთარ პროექტში", "დააკოპირე ეს საქაღალდე. პროექტის <code>sim.html</code>-ში შეცვალე მხოლოდ ზედა ხაზები: <code>KEY</code> = პროექტის სახელი, <code>APP</code> = აპის მთავარი ფაილი, სურვილისამებრ <code>DEFAULT_THEME</code> = თემა პირველ გაშვებაზე. ასლს სხვა არაფერს უცვლი. განახლება: ახალ <code>sim.html</code>-ს, <code>sim-bridge.js</code>-ს და <code>sim-sw.js</code>-ს ზემოდან აკოპირებ და ამ ხაზებს თავიდან სვამ."],
      ["fileText", "დეტალები", "ტექნიკური: <code>README.md</code>. იგივე სახელმძღვანელო ინგლისურად, სხვისთვის გასაგზავნად: <code>GUIDE.html</code>. ორივე ამ საქაღალდეშია."] ] }
  ], en: [
    { id: "bar", ic: "panelTop", name: "Buttons", intro: "The top bar has three parts: on the left Open app, the phone and the app, in the middle right above the phone Reload, on the right Rotate and Device, Zoom, the console panel, ⓘ and ⚙. The buttons do what a real phone does; hold the mouse over one for a short hint.", items: [
      ["folderOpen", "Open app", "The first button of the bar: which app opens in the phone. It opens a small panel; click outside it or press Esc to close it. <b>Choose folder…</b> = pick the app's folder (<code>index.html</code>, or <code>www/</code> or <code>dist/</code>) and the app opens from it; <code>sim-bridge.js</code> is added by itself, ↻ shows your edits, a page refresh forgets the folder. <b>Choose APK…</b> = an Android app file (<code>.apk</code>): its web part opens (<code>assets/public/</code>: Capacitor, <code>assets/www/</code>: Cordova, Construct 2); a native app (Java / Kotlin, Unity, Flutter) does not, and the console says so. Both buttons work only when the simulator is opened as a web page (the live demo or a local server), in Chrome or Edge. The field under it: a path from <code>sim.html</code> (e.g. <code>myapp/index.html</code>), a file path from Windows (Shift + right-click the file → Copy as path) or an address (e.g. <code>http://localhost:5173</code>), then Enter. Empty = the default app, or an empty phone if there is none. It goes into the address bar, so a refresh opens it again. A file path works only while the simulator itself is opened from a file. An app opened from the field needs <code>sim-bridge.js</code>, or it only shows in the frame. At the bottom of the panel: the demo app as a zip, to try it."],
      ["back", "Back", "The phone's back button; ◁ on the phone (3-button mode) and a swipe in from the edge (Gestures mode) do the same. What it means is up to the app: the previous screen, closing a window, or nothing. It does not reach an app that is in the background or closed."],
      ["pause", "Background", "As if you pressed Home or switched to another app. The app is told it is hidden, and its animations stop. A cover sits over the screen. ○ on the phone (3-button mode) does the same."],
      ["play", "Return", "Brings the app back from the background. It should continue where it was."],
      ["power", "Close / Open", "As if the app was swiped away from the recent-apps list, or the phone closed it to free memory. The app gets <b>no</b> warning: anything it had not saved is lost. The next press (Open) starts the app from scratch; only saved data survives."],
      ["rotP", "Rotate", "Upright ↔ sideways. On the icon the faint screen = now, the solid one = after the press. The simulator remembers it."],
      ["vol2", "Mute", "All the app's sound goes quiet at once; the button stays filled while the sound is off. The waves on the icon = the current level. Level: ⚙ → Volume."],
      ["pointer", "Finger / mouse", "Over the screen the mouse is a finger or a plain mouse. More: the “Finger and zoom” tab."],
      ["camera", "Screenshot", "The button opens a menu; each choice downloads a PNG file. <b>Screen</b>: the phone's screen only (with the system bars, without the camera and the rounded corners). The console writes the size and whether it fits Google Play's rule: each side 320–3840 px, the long side at most twice the short one. 360 × 800 is too long; ⚙ → Size 360 × 640 fits. <b>Phone</b>: the phone with its frame and camera, on a transparent background, no shadow. For about a second the background turns black, then white: the two frames give the file its transparency. <b>Whole window</b>: the simulator as you see it. The browser asks for permission every time: pick <b>this tab</b>. For the shot Chrome draws the tab twice as sharp, so the file is twice the size the phone shows at on your monitor; for more, raise the zoom (for Screen and Phone the whole phone must be in view). Works in Chrome and Edge."],
      ["video", "Video", "The phone as a video file. Press = a menu; a pick = recording starts: the browser asks for permission, pick <b>this tab</b>. While it records, the button is red and the time shows beside it. Press again = it stops and the file downloads; the browser's own “Stop sharing” stops and saves it too. <b>Screen</b>: the screen only (with the system bars and the touch circles, without the camera and the rounded corners). <b>Phone</b>: the phone with its frame and camera, no shadow, on the page's background (an MP4 cannot be transparent), touch circles included. While it records, Rotate, Device and Size are locked, Zoom is not. Both work in <b>presentation mode</b> too. Format: MP4 if the browser can write it, otherwise WEBM. Sound: ⚙ → Sound in video. The console writes the size, length, format and MB."],
      ["presentation", "Presentation mode", "The top bar, the console and the line under the phone hide; only the phone stays, in the middle of the window. It works as usual. A faint dot sits in the window's top-left corner: the mouse on it opens a card with three buttons, <b>Video</b> and <b>Screenshot</b> (the same menus as in the top bar) and <b>Exit</b>; 0.8 s after the mouse leaves, it folds back into the dot. On entering, the card shows for a few seconds. While a video records, the dot blinks red and the time shows beside it. The dot and the card do not show in a screenshot or a video. Esc exits too when the app does not have the focus (click outside the phone first). The zoom stays as it was. Not remembered: a refresh opens the normal view. Leaving it while a video started here records stops the recording and saves the file."],
      ["reload", "Reload", "In the middle of the bar, above the phone. Starts the app again. The console keeps its lines, so you can compare before and after."],
      ["smartphone", "Device", "Left of Zoom. Which phone or tablet, grouped by maker: Samsung (foldables too, folded / open), Pixel, iPhone, iPad and generic sizes (an old small Android, a tall screen, a small tablet); newest first in each group. The first start shows Pixel 6 Pro, later the one you picked last. A real device shows in its own frame: body, keys, the hole or notch where it is. An iPhone or the iPad turns on iPhone mode: iOS bars and safe areas, a home line instead of ◁ ○ □, no system Back (Bars and Camera in ⚙ are off). The numbers (e.g. 360×800) are the size the app “sees”, not the screen's hardware pixels. Not in the list? Your own size: ⚙ → Size."],
      ["100%", "Zoom", "How big the phone is on your monitor. The button shows the current scale; a click opens its panel: a slider 40-200%, Fit · 50% · 100% · Natural. More: the “Finger and zoom” tab."],
      ["panelRight", "Console panel", "Where the console sits: <b>Auto</b> (the start: right of the phone, or under it when the window is taller than wide, e.g. an upright monitor), <b>Right</b> (upright, beside the phone), <b>Bottom</b> (wide, under the phone) or <b>Hidden</b>. The icon shows where it is now; a click opens the menu. Size: drag the panel's inner edge (width 260–900 px, height from 120 px to 60 % of the window). A double click on the edge, or Default size in the menu = 400 / 260 px. The simulator remembers it. In a narrow window (under 800 px: a phone, a tablet held upright) the console is a strip at the bottom: the arrow or a tab opens it to half the window, the arrow closes it."],
      ["info", "Info", "This window. Close it with ✕, Esc or a click outside."],
      ["settings", "Settings", "Opens the ⚙ panel. More: the “Settings” tab."] ] },
    { id: "touch", ic: "pointer", name: "Finger and zoom", intro: "Finger mode is on from the start. Over the phone screen the mouse becomes a finger and the app gets real touches. Outside the screen the mouse stays a normal mouse.", items: [
      ["dot", "Press", "A small white circle appears where the finger touches. Instead of the arrow, a faint ring shows where the finger will land."],
      ["move", "Drag", "The pressed finger slides; a list or a page scrolls under it. A move of more than ~10 px no longer counts as a tap."],
      ["moveH", "Wheel = two fingers", "Two circles, one on each side of the cursor. Wheel up = they move apart (zoom in), wheel down = they come together (zoom out). They lift a moment after the wheel stops."],
      ["mouse", "Mouse mode", "Press the finger button. The mouse is a plain mouse on the screen too, for what a fake finger cannot do: a drop-down list, a slider, selecting text."],
      ["100%", "Zoom", "A button in the top bar; a click opens its panel. <b>Fit</b> = the phone fits the window, at most 100%. <b>The slider</b> = 40 to 200%, in steps of 10; 50% and 100% have buttons too. <b>Natural</b> = real size: the phone on the screen is as big as in your hand (a real device by its body's millimetres; a generic size or your own = Android's 160 dp per inch); the button then shows 1:1. For this the simulator must know the screen's density: the panel's bottom line → <b>Calibrate</b>: hold a bank card to the screen and match the outline (no card: a ruler, the outline = 85.6 × 54 mm). It is saved for each screen; on an unknown screen Natural opens Calibrate first. Windows scaling and the browser's Ctrl +/− do not spoil the size. When the phone does not fit, scroll with the scrollbars or with the wheel outside the screen. Nothing changes for the app."],
      ["code", "Right click", "Opens the browser's menu (Inspect); the app does not see it."] ] },
    { id: "settings", ic: "settings", name: "Settings", intro: "⚙ opens the panel. Click outside it or press Esc to close it. Every choice is remembered.", items: [
      ["scaling", "Size", "Type your own width × height if your phone is not in the Device list in the top bar."],
      ["panelBottom", "Bars", "The phone's top bar (clock, battery) and bottom bar. <b>Gestures</b> = a thin line at the bottom, as on new phones; in finger mode: a swipe in from the left or right edge = Back (an arrow shows at the edge; a short swipe does nothing), a swipe up from the bottom line = Home. The app no longer gets such a touch (touchcancel), as on a phone. <b>3 buttons</b> = ◁ ○ □: ◁ = Back, ○ = Home (the app goes to the background), □ does nothing; on a sideways phone (not a tablet) they move to the right edge. <b>Hidden</b> = a full-screen game, no bars. Default: 3 buttons."],
      ["circleDot", "Camera hole", "The front camera's hole in the screen, on by default. Upright it is at the top, sideways on the left. It covers a strip of the screen even when the bars are hidden."],
      ["palette", "Theme", "Colour sets (light, dark and more) for apps that use themes. The app changes its colours at once."],
      ["vol2", "Volume", "The phone's volume buttons: 0 to 15, as on Android. Changes all the app's sound (music, effects) at once; the phone shows its volume bar for a moment. The app is not told, as on a real phone. Moving the slider turns mute off."],
      ["megaphone", "Ads", "<b>Ads come</b> = the app gets a test ad. <b>No ads</b> = every load fails with “No fill”, as offline or when there is nothing to show. This is how you check that the app works without ads too. It acts only on an app that uses AdMob (the “For app builders” tab)."],
      ["pointer", "Touches in console", "On by default. In finger mode every gesture becomes one console line: <b>tap</b> x, y · <b>double tap</b> · <b>swipe</b> (arrow = the way the finger moved, distance, time) · <b>scroll</b> (the browser scrolled by itself) · <b>two fingers</b>: apart / together × · <b>gesture</b> from the edge / the bottom (Gestures mode). At the end = the element the finger landed on. In the filter: “Touches”."],
      ["globe", "Internet", "Off = as if the phone had no internet. The app's own files still load (in an APK they are on the phone), but a request to <b>another address</b> (<code>fetch</code>, <code>XMLHttpRequest</code>) fails, <code>navigator.onLine</code> is false, the app gets the <code>offline</code> / <code>online</code> event, and no ads come. The signal and Wi-Fi icons in the status bar fade. Pictures and scripts loaded by an HTML tag are not stopped."],
      ["type", "Font size", "Android's “Font size” setting. On a phone the WebView makes text bigger with it while the boxes stay the same, so text may no longer fit. 130% and 200% show where the layout breaks. Text drawn on a canvas does not change. An estimate: a line height given in px does not grow."],
      ["gauge", "FPS meter", "A number in the corner of the screen: how many frames a second the app draws, and the longest frame of the last half second (ms). Green = 55+, yellow = 30+, red = fewer. A PC is faster than a phone: what stutters here is worse on a phone; what is smooth here still needs a check on a phone."],
      ["video", "Sound in video", "On by default. A video records the app's sound too (music, effects), at the ⚙ → Volume level. In the browser's question, sharing the tab's sound must be on; if it is not, the video records without sound and the console says so."],
      ["languages", "Language", "The last row of the panel. The simulator's own words: Georgian or English. One choice for all projects. The app inside the phone does not change."] ] },
    { id: "screen", ic: "terminal", name: "Screen and console", intro: "The line under the phone tells you what the app gets right now (in a narrow window, such as a phone, it hides behind a faint ⓘ beside the phone's bottom right corner: tap it). For example:<br><span class=\"eg\">Galaxy A15, typical · 360 × 800 · app 360 × 800 · under the bars: ↑28 ↓22 ←0 →0 · 75%</span>", items: [
      ["smartphone", "360 × 800", "The screen size."],
      ["scaling", "app 360 × 800", "The space the app draws on."],
      ["panelTop", "under the bars ↑ ↓ ← →", "How much of each edge (top, bottom, left, right) a bar or the camera hole covers. Buttons and text must keep out of these strips. If this part is missing, the bars never cover the app; its space is simply smaller."],
      ["100%", "75%", "How big the phone is shown: Fit, the zoom you picked or Natural. It does not affect the app."],
      ["terminal", "Console", "The app's diary: what the user pressed, which screen opened. The app writes these lines itself: with <code>log()</code> or plain <code>console.log</code> / <code>warn</code> / <code>error</code> (an object shows as short text; the browser's console gets it too). The simulator adds its own too: back, background, close, reload, theme, volume, vibration, link, ads, language, finger / mouse, and each touch (⚙ → Touches in console). The last 5000 lines are kept. Where it sits and how big: the “Buttons” tab → Console panel."],
      ["vibrate", "Vibration", "When the app vibrates (<code>navigator.vibrate</code>, Capacitor's Haptics), a zigzag lights up on each side of the phone for every buzz of the pattern; the console writes the pattern in ms. A buzz shorter than 80 ms still shows for 80 ms. Before the first touch on the screen the call is blocked, as in Chrome on a phone (the console warns)."],
      ["link", "Links", "On a phone a link to another address (not a page of the app itself) does not open inside the app: Capacitor hands it to Android, the app it belongs to opens, and ours goes to the background. The simulator does the same: that app (browser, Play Store, mail, phone, messages, maps) and the address appear on the screen, and the console writes the link. ◁ brings the app back. A button also opens a web address on your PC. Another app's own link (e.g. <code>whatsapp:</code>) opens on a phone only if that app is installed; otherwise nothing happens: the app stays and the console warns. Caught: a tapped link (also with <code>target=\"_blank\"</code>), <code>location.href</code> and <code>window.open</code>."],
      ["megaphone", "Ads", "If the app uses AdMob, the simulator draws a stand-in ad instead of a real one. The <b>banner</b> lies over the app (at the top under the status bar, at the bottom above the navigation bar) and does not make it smaller: making room is the app's job. The <b>interstitial</b> covers the whole screen; ✕ or ◁ closes it. While it shows, ◁ does not reach the app and the app does not stop. A tap on an ad = a link to the Play Store: the app goes to the background, ◁ brings it back. The console writes every step. Close, ↻ and opening another app clear the ads."],
      ["circleX", "Red line", "An error (an uncaught Promise too). Something in the app broke, even if the screen looks fine."],
      ["listChecks", "Filter", "Small chips under the console head: App, Simulator (its own lines), Touches, Commands, Warnings (yellow), Errors (red); touches and commands have their own colour in the console. Only the chips that are on show: click = hide, double click = only this (again = all). <b>+N</b> = the hidden ones, bring one back from the list. How many lines = in the chip's hint. Remembered."],
      ["search", "Search", "The icon opens a field: only the lines that contain this text show (together with the filter). Esc clears the field; another click on the icon closes it."],
      ["dots", "⋮ More", "<b>Copy</b> = the lines that show now (filter and search) to the clipboard. <b>Save as .txt</b> = the same as a file (console-date-time.txt). <b>Clear</b> = the console is emptied."],
      ["arrowDown", "New lines", "Scrolled up, the console no longer jumps to the end, and “↓ N new lines” appears. Click it = back to the end."],
      ["copy", "Repeated lines", "The same line several times in a row is written once, with a count at its end: <b>×12</b>. A loop no longer floods the console. The time is the first line's."],
      ["listCollapse", "Groups", "Similar lines in a row (same kind, same text, only the numbers differ; for touches the element too) fold into one group from 3 lines on: <b>▸</b>, the newest line's time, the line's pattern (<b>#</b> for each number) and how many lines. Press = open / fold. After the filter or the search the groups form again from the lines that show. Copy and save write every line on its own."],
      ["terminal", "Command line", "A small editor at the bottom of the console. What you type runs as JavaScript inside the app: <b>Enter</b> = run, <b>Shift+Enter</b> = a new line (2 lines to start, grows to 6). The command (<b>›</b>) and the answer (<b>←</b>) have their own colour in the console, an error is red; in the filter: “Commands”. For example <code>startLevel(10)</code> or <code>localStorage.length</code>. ↑ on the first line / ↓ on the last = earlier commands (the last 50). The icon in the console head shows / hides it (remembered). It works when the app has <code>sim-bridge.js</code> and is opened from a file, from localhost, or from the simulator's own address."] ] },
      ["fileText", "Data", "The second tab beside the console: what the app saved in <code>localStorage</code> (records, settings). The pencil = change a value, the bin = delete one, <b>Clear data</b> = delete all (press twice), like Android's “Clear storage”: after ↻ Reload the app starts as on a first launch. The list updates by itself when the app saves something. The simulator's own settings are not shown and not deleted."],
      ["abc", "Keyboard", "When you press a text field in the app, a keyboard comes up at the bottom of the screen and the app gets shorter, as on a phone: you see whether a field or a button gets covered. Its keys type into the field (⇧ = a capital, ↵ = Enter; ?123 is still a picture); the PC keyboard types too. ◁ or a press outside the field hides it. Its height: portrait as measured on a real phone (32 %, with a strip of icons on top), landscape an estimate."],
    { id: "check", ic: "listChecks", name: "Checks", intro: "Five checks, about ten minutes. Every time, before you show the app to anyone.", items: [
      ["1", "Different sizes", "Small (Old Android 360×640), typical (Galaxy A15), big (iPhone 16 Pro Max) and, if the app is for tablets too, iPad. Nothing is cut off, no text runs out of its box, every button can be reached. If the app works both upright and sideways, rotate on each size."],
      ["2", "Bars and camera", "With the camera hole on, switch the bars: Gestures, 3 buttons, Hidden. Nothing important (a button, a score, a title) hides under a bar or the hole."],
      ["3", "Back", "Press it on every screen. It goes where the user expects. The app never gets stuck and never quits by surprise."],
      ["4", "Background and close", "Use the app for a moment, then Background → Return: it continues where it was (timer, music, game). Then Close → Open: is the progress still there? What is lost here is lost on a real phone too."],
      ["5", "Console", "After all of the above, there are no red lines."] ] },
    { id: "limits", ic: "alert", name: "Limits", intro: "The simulator is close to a phone, but it is not a phone. Always try the app on a real phone before publishing.", items: [
      ["gauge", "Speed and sound", "A computer is faster than most phones."],
      ["vibrate", "Vibration strength", "The zigzags show how long and in what rhythm the phone buzzes, not how strongly."],
      ["link", "A link's app", "On a phone an https link sometimes opens the site's own app instead of the browser (YouTube and others), if it is installed; the simulator always shows the browser. In Firefox only a tapped link is caught, not <code>location.href</code>."],
      ["pointer", "Touch is approximate", "One finger, or two fingers pinching in or out. Not there: long-press, fling (a list stops the moment the finger lifts), two fingers moving freely. Drop-down lists, sliders and text selection need Mouse mode."],
      ["type", "Fonts", "A phone may use a different font, so text can come out wider or narrower."],
      ["ruler", "Bar and camera sizes", "Measured on one phone (Pixel 6 Pro); other phones differ by a few px."],
      ["rotL", "Turned to the right", "Sideways = the phone turned to the left (camera on the left). Turned to the right is not shown."],
      ["timer", "Timers in the background", "In the background the simulator does not stop the app's timers and sounds. The app has to stop them itself (a real phone does not always do it either)."],
